name: E8450-IMM-OP

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      branch:
        description: "immortalwrt Branch"
        required: true
        default: 'v25.12.0'
      ssh:
        description: 'Actions SSH debug'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: ${{ github.event.inputs.branch || 'v25.12.0' }}
  FEEDS_CONF: E8450/feeds.conf.default
  CONFIG_FILE: E8450/im2512.config
  DIY_P1_SH: E8450/diy-part-1.sh
  DIY_P2_SH: E8450/diy-part-4.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🚀 优化环境与清理磁盘空间
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          echo "🧹 Cleaning Docker..."
          docker system prune -a -f --volumes || true

          echo "🗑️ Removing unused SDKs..."
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/share/swift \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/az \
            /usr/local/share/boost \
            /usr/share/gradle \
            /opt/microsoft

          echo "📦 Installing dependencies..."
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y --no-install-recommends \
            build-essential clang llvm flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev dos2unix dwarves quilt npm jq ccache ninja-build \
            python3-setuptools rsync swig unzip zlib1g-dev file wget xsltproc zip zstd

          echo "🚀 Setting up pnpm..."
          corepack enable
          corepack prepare pnpm@9 --activate

          echo "🧼 Cleaning apt..."
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "🕐 Setting timezone..."
          sudo timedatectl set-timezone "${TZ:-Asia/Shanghai}"

          echo "📁 Creating workdir..."
          sudo mkdir -p /workdir
          sudo chown "$USER":"$(id -gn)" /workdir
          
      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Cache OpenWrt Build
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: true
          toolchain: true
          skip: true
          prefix: /workdir/openwrt
          mixkey: e8450-im2512          

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Fix Rust build
        run: |
          cd /work/openwrt
          RUST_MAKEFILE="feeds/packages/lang/rust/Makefile"
          if [ -f "$RUST_MAKEFILE" ]; then
            echo "===== 禁用 Rust 远程 CI LLVM 下载 (防 404 报错) ====="
            sed -i 's/--set=llvm.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/' "$RUST_MAKEFILE" || true
          fi

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@v1.0.0
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Patch Kernel Config
        run: |
          cd openwrt
          for cfg in $(find target/linux/mediatek -name "config-6*"); do
            echo "Checking $cfg"

            sed -i '/CONFIG_NET_SCH_BPF/d' "$cfg"
            echo "CONFIG_NET_SCH_BPF=y" >> "$cfg"

            sed -i '/CONFIG_BPF_SYSCALL/d' "$cfg"
            echo "CONFIG_BPF_SYSCALL=y" >> "$cfg"

            sed -i '/CONFIG_BPF_JIT/d' "$cfg"
            echo "CONFIG_BPF_JIT=y" >> "$cfg"

            sed -i '/CONFIG_NETKIT/d' "$cfg"
            echo "CONFIG_NETKIT=y" >> "$cfg"

            sed -i '/CONFIG_NF_CONNTRACK_CHAIN_EVENTS/d' "$cfg"
            echo "CONFIG_NF_CONNTRACK_CHAIN_EVENTS=y" >> "$cfg"
          done

      - name: Download package
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j"$(nproc)"
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          set -o pipefail
          cd openwrt

          echo "===== 配置 ccache ====="
          mkdir -p ~/.ccache
          ccache -M 5G
          ccache -z
          
          echo -e "$(nproc) thread compile"
          make -j"$(nproc)" || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

          echo "===== ccache 编译统计 ====="
          ccache -s

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 3

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.0
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
