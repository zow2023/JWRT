name: E8450-IMM-OP

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      branch:
        description: "immortalwrt Branch"
        required: true
        default: "v25.12.0"
        type: string
      ssh:
        description: "Actions SSH debug"
        required: false
        default: false
        type: boolean

# 避免相同分支同时运行时互相覆盖 Toolchain Release。
concurrency:
  group: e8450-${{ github.event.inputs.branch || 'v25.12.0' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: ${{ github.event.inputs.branch || 'v25.12.0' }}

  FEEDS_CONF: E8450/feeds.conf.default
  CONFIG_FILE: E8450/im2512.config
  DIY_P1_SH: E8450/diy-part-1.sh
  DIY_P2_SH: E8450/diy-part-4.sh

  UPLOAD_BIN_DIR: "false"
  UPLOAD_FIRMWARE: "true"
  UPLOAD_RELEASE: "false"

  # 与 actions/cache 的缓存路径保持一致。
  CCACHE_DIR: /workdir/openwrt/.ccache

  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 优化环境与清理磁盘空间
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          echo "Cleaning Docker..."
          docker system prune -a -f --volumes || true

          echo "Removing unused SDKs..."
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/share/swift \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/az \
            /usr/local/share/boost \
            /usr/share/gradle \
            /opt/microsoft

          echo "Installing dependencies..."
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y --no-install-recommends \
            build-essential clang llvm flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev dos2unix dwarves quilt npm jq ccache ninja-build \
            python3-setuptools rsync swig unzip zlib1g-dev file wget xsltproc zip zstd

          echo "Cleaning apt..."
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "Setting timezone..."
          sudo ln -sf "/usr/share/zoneinfo/${TZ}" /etc/localtime
          echo "${TZ}" | sudo tee /etc/timezone >/dev/null

          echo "Creating workdir..."
          sudo mkdir -p /workdir
          sudo chown "$USER":"$(id -gn)" /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          set -e
          df -hT "$PWD"
          git clone --depth 1 --single-branch -b "$REPO_BRANCH" "$REPO_URL" openwrt
          ln -sfn /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          mkdir -p /workdir/openwrt/.ccache /workdir/openwrt/dl

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/.ccache
          # 每次运行使用新 key，否则精确命中后 actions/cache 不会保存更新后的 ccache。
          key: ccache-${{ runner.os }}-e8450-${{ github.event.inputs.branch || 'v25.12.0' }}-${{ hashFiles('E8450/im2512.config', 'E8450/feeds.conf.default', 'E8450/diy-part-1.sh', 'E8450/diy-part-4.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          # 同分支回退到最新的历史缓存，普通软件包配置变化仍可复用 ccache。
          restore-keys: |
            ccache-${{ runner.os }}-e8450-${{ github.event.inputs.branch || 'v25.12.0' }}-

      - name: Load custom feeds
        run: |
          set -e

          if [[ -e "$FEEDS_CONF" ]]; then
            mv "$FEEDS_CONF" openwrt/feeds.conf.default
          fi

          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a

      - name: Fix Rust build
        run: |
          cd openwrt
          RUST_MAKEFILE="feeds/packages/lang/rust/Makefile"

          if [[ -f "$RUST_MAKEFILE" ]]; then
            echo "Disabling Rust remote CI LLVM download."
            sed -i \
              's/--set=llvm.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/' \
              "$RUST_MAKEFILE" || true
          fi

      - name: Load custom configuration
        run: |
          set -e

          if [[ -e files ]]; then
            mv files openwrt/files
          fi

          if [[ -e "$CONFIG_FILE" ]]; then
            mv "$CONFIG_FILE" openwrt/.config
          fi

          chmod +x "$DIY_P2_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@v1.0.0
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.ssh) || (github.event_name == 'repository_dispatch' && contains(github.event.action, 'ssh')) }}
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Patch Kernel Config
        run: |
          set -e
          cd openwrt

          while IFS= read -r -d '' cfg; do
            echo "Patching $cfg"

            sed -i \
              -e '/CONFIG_NET_SCH_BPF/d' \
              -e '/CONFIG_BPF_SYSCALL/d' \
              -e '/CONFIG_BPF_JIT/d' \
              -e '/CONFIG_NETKIT/d' \
              -e '/CONFIG_NF_CONNTRACK_CHAIN_EVENTS/d' \
              "$cfg"

            cat >> "$cfg" <<'EOF'
          CONFIG_NET_SCH_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_NETKIT=y
          CONFIG_NF_CONNTRACK_CHAIN_EVENTS=y
          EOF
          done < <(find target/linux/mediatek -name 'config-6*' -print0)

      # 对源码和 feeds 的当前提交生成下载缓存指纹；版本变化时产生新缓存，避免旧归档永久不更新。
      - name: Prepare download cache key
        working-directory: /workdir/openwrt
        run: |
          set -euo pipefail

          DOWNLOAD_SOURCE_HASH="$(
            {
              printf 'openwrt %s\n' "$(git rev-parse HEAD)"
              while IFS= read -r -d '' git_entry; do
                repo="${git_entry%/.git}"
                if [[ -d "$repo" && -e "$repo/.git" ]]; then
                  commit="$(git -C "$repo" rev-parse HEAD 2>/dev/null || printf unknown)"
                  printf '%s %s\n' "${repo#/workdir/openwrt/}" "$commit"
                fi
              done < <(find feeds package -name .git -print0)
            } | LC_ALL=C sort | sha256sum | cut -c1-12
          )"

          echo "DOWNLOAD_SOURCE_HASH=${DOWNLOAD_SOURCE_HASH}" >> "$GITHUB_ENV"
          echo "Download source hash: ${DOWNLOAD_SOURCE_HASH}"

      # 缓存 make download 获取的源码归档，减少每次运行的重复网络下载。
      - name: Cache OpenWrt download sources
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: dl-${{ runner.os }}-e8450-${{ github.event.inputs.branch || 'v25.12.0' }}-${{ env.DOWNLOAD_SOURCE_HASH }}-${{ hashFiles('E8450/im2512.config', 'E8450/feeds.conf.default', 'E8450/diy-part-1.sh', 'E8450/diy-part-4.sh') }}
          restore-keys: |
            dl-${{ runner.os }}-e8450-${{ github.event.inputs.branch || 'v25.12.0' }}-

      - name: Download packages
        id: package
        run: |
          set -e
          cd openwrt

          make defconfig

          # 确保 OpenWrt 使用 ccache，并与工作流缓存目录一致。
          sed -i \
            -e '/^CONFIG_CCACHE=/d' \
            -e '/^CONFIG_CCACHE_DIR=/d' \
            .config

          cat >> .config <<'EOF'
          CONFIG_CCACHE=y
          CONFIG_CCACHE_DIR="/workdir/openwrt/.ccache"
          EOF

          make defconfig
          make download -j"$(nproc)"

          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # 只根据工具链源码和真正影响工具链的 .config 项生成缓存标签。
      # 放在 make defconfig 与软件包下载之后，保证读取的是规范化后的最终配置。
      - name: Prepare Toolchain cache key
        working-directory: /workdir/openwrt
        run: |
          set -euo pipefail

          SAFE_BRANCH="$(printf '%s' "$REPO_BRANCH" | sed -E 's/[^A-Za-z0-9._-]+/-/g' | cut -c1-24)"

          # 使用 tools/ 与 toolchain/ 的 Git tree 对象哈希，避免普通源码提交
          # 或 HomeProxy、sing-box 等软件包选择变化导致工具链缓存失效。
          TOOLCHAIN_SOURCE_HASH="$(
            {
              git rev-parse HEAD:tools
              git rev-parse HEAD:toolchain
            } | sha256sum | cut -c1-12
          )"

          # 只纳入架构、ABI、C 库、GCC/Binutils、BPF/LLVM 等工具链相关选项。
          # 普通 CONFIG_PACKAGE_* 与 CONFIG_CCACHE_DIR 不参与此哈希。
          TOOLCHAIN_CONFIG_HASH="$(
            grep -E '^(# )?CONFIG_(ARCH|ARCH_64BIT|BIG_ENDIAN|aarch64|arm|mipsel|TARGET_BOARD|TARGET_SUBTARGET|TARGET_mediatek|TARGET_mediatek_mt7622|TARGET_ARCH_PACKAGES|TARGET_OPTIMIZATION|TARGET_CPU|CPU_TYPE|CPU_SUBTYPE|SOFT_FLOAT|USE_MIPS16|TOOLCHAINOPTS|EXTERNAL_TOOLCHAIN|NATIVE_TOOLCHAIN|EXTERNAL_GCC_VERSION|EXTERNAL_TOOLCHAIN_LIBC_USE_(GLIBC|MUSL)|TOOLCHAIN_(LIBC|PREFIX|ROOT|INC_PATH|LIB_PATH|BIN_PATH)|EXTRA_TARGET_ARCH(_NAME|_OPTS)?|MIPS64_ABI_(N64|N32|O32)|LIBC_USE_(GLIBC|MUSL)|USE_(GLIBC|MUSL)|MUSL_DISABLE_CRYPT_SIZE_HACK|GCC_USE_VERSION_[0-9]+|GCC_USE_GRAPHITE|EXTRA_GCC_CONFIG_OPTIONS|GCC_DEFAULT_(PIE|SSP)|SJLJ_EXCEPTIONS|INSTALL_(GFORTRAN|GCCGO)|BINUTILS_USE_VERSION_[0-9_]+|EXTRA_BINUTILS_CONFIG_OPTIONS|BPF_TOOLCHAIN(_NONE|_PREBUILT|_BUILD_LLVM|_HOST|_HOST_PATH)?|HAS_PREBUILT_LLVM_TOOLCHAIN|USE_LLVM_(HOST|BUILD|PREBUILT)|DWARVES|GDB(_PYTHON)?|NASM)(=.*| is not set)$' .config \
              | LC_ALL=C sort \
              | sha256sum \
              | cut -c1-12
          )"

          # v2 用于和旧版“整份配置文件哈希”的缓存标签隔离。
          TOOLCHAIN_TAG="toolchain-e8450-v2-${SAFE_BRANCH}-${TOOLCHAIN_SOURCE_HASH}-${TOOLCHAIN_CONFIG_HASH}"

          echo "SAFE_BRANCH=${SAFE_BRANCH}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_SOURCE_HASH=${TOOLCHAIN_SOURCE_HASH}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_CONFIG_HASH=${TOOLCHAIN_CONFIG_HASH}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_TAG=${TOOLCHAIN_TAG}" >> "$GITHUB_ENV"

          echo "Toolchain source hash: ${TOOLCHAIN_SOURCE_HASH}"
          echo "Toolchain config hash: ${TOOLCHAIN_CONFIG_HASH}"
          echo "Toolchain cache tag: ${TOOLCHAIN_TAG}"

      - name: Restore Toolchain from Release
        id: restore-toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DOWNLOAD_DIR="/tmp/toolchain-cache"
          mkdir -p "$DOWNLOAD_DIR"

          echo "Checking Toolchain Release: ${TOOLCHAIN_TAG}"

          if ! gh release download "$TOOLCHAIN_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "toolchain.tar.zst" \
            --dir "$DOWNLOAD_DIR"; then
            echo "No usable Toolchain Release found; building Toolchain from source."
            echo "TOOLCHAIN_EXISTS=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if ! tar -I zstd -xf "$DOWNLOAD_DIR/toolchain.tar.zst" -C /workdir/openwrt; then
            echo "Toolchain archive could not be extracted; rebuilding it."
            rm -rf /workdir/openwrt/staging_dir/host* /workdir/openwrt/staging_dir/tool*
            echo "TOOLCHAIN_EXISTS=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # 确认归档里确实有 cachewrtbuild 风格的目录。
          shopt -s nullglob
          HOST_PATHS=(/workdir/openwrt/staging_dir/host*)
          TOOL_PATHS=(/workdir/openwrt/staging_dir/tool*)

          if (( ${#HOST_PATHS[@]} == 0 || ${#TOOL_PATHS[@]} == 0 )); then
            echo "Toolchain archive is missing staging_dir/host* or staging_dir/tool*."
            rm -rf /workdir/openwrt/staging_dir/host* /workdir/openwrt/staging_dir/tool*
            echo "TOOLCHAIN_EXISTS=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # 与 cachewrtbuild 的跳过方式保持一致：缓存确认恢复成功后，
          # 从顶层 Makefile 移除工具链 stamp-compile/stamp-install 依赖。
          cd /workdir/openwrt
          sed -i 's/ $(tool.*\/stamp-compile)//;' Makefile
          sed -i 's/ $(tool.*\/stamp-install)//;' Makefile

          echo "TOOLCHAIN_EXISTS=true" >> "$GITHUB_ENV"
          echo "Toolchain cache restored and toolchain build dependencies skipped."

      - name: Compile the firmware
        id: compile
        run: |
          set -e
          set -o pipefail
          cd openwrt

          echo "Configuring ccache..."
          mkdir -p "$CCACHE_DIR"
          ccache -M 5G
          ccache -z

          echo "Compiling with $(nproc) threads..."
          make -j"$(nproc)" || make -j1 || make -j1 V=s

          echo "status=success" >> "$GITHUB_OUTPUT"

          grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
            | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME

          if [[ -s DEVICE_NAME ]]; then
            echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
          fi

          echo "FILE_DATE=_$(date +'%Y%m%d%H%M')" >> "$GITHUB_ENV"

          echo "ccache statistics:"
          ccache -s

      - name: Save Toolchain to Release
        if: ${{ steps.compile.outputs.status == 'success' && env.TOOLCHAIN_EXISTS != 'true' && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /workdir/openwrt

          shopt -s nullglob
          CACHE_PATHS=(staging_dir/host* staging_dir/tool*)

          if (( ${#CACHE_PATHS[@]} == 0 )); then
            echo "No staging_dir/host* or staging_dir/tool* paths found; cannot save Toolchain cache."
            exit 1
          fi

          echo "Packing Toolchain cache paths: ${CACHE_PATHS[*]}"
          tar -I 'zstd -3' -cf toolchain.tar.zst "${CACHE_PATHS[@]}"

          if gh release view "$TOOLCHAIN_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists; replacing its Toolchain asset."
            gh release upload "$TOOLCHAIN_TAG" toolchain.tar.zst \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Creating Toolchain Release."
            gh release create "$TOOLCHAIN_TAG" toolchain.tar.zst \
              --repo "$GITHUB_REPOSITORY" \
              --title "Toolchain Cache (${TOOLCHAIN_TAG})" \
              --notes "OpenWrt Toolchain cache (staging_dir/host* and staging_dir/tool*)."
          fi

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: ${{ steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true' }}
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize firmware files
        id: organize
        if: ${{ env.UPLOAD_FIRMWARE == 'true' && !cancelled() }}
        run: |
          set -euo pipefail

          mapfile -t TARGET_DIRS < <(
            find openwrt/bin/targets -mindepth 2 -maxdepth 2 -type d
          )

          if [[ "${#TARGET_DIRS[@]}" -ne 1 ]]; then
            echo "Expected one firmware target directory; found ${#TARGET_DIRS[@]}."
            printf '%s\n' "${TARGET_DIRS[@]}"
            exit 1
          fi

          cd "${TARGET_DIRS[0]}"
          rm -rf packages

          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: ${{ steps.organize.outputs.status == 'success' && !cancelled() }}
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}


      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 3
