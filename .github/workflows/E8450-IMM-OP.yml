name: E8450-IMM-OP

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      branch:
        description: "immortalwrt Branch"
        required: true
        default: "v25.12.2"
        type: string
      ssh:
        description: "Actions SSH debug"
        required: false
        default: false
        type: boolean
      clean_cache:
        description: "Clean build cache (delete cache releases, skip restore/save)"
        required: false
        default: 'false'
      skip_saving:
        description: "Skip saving build cache"
        required: false
        default: 'false'

# 避免相同分支同时运行时互相覆盖缓存 Release。
concurrency:
  group: e8450-${{ github.event.inputs.branch || 'v25.12.2' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: ${{ github.event.inputs.branch || 'v25.12.2' }}

  FEEDS_CONF: E8450/feeds.conf.default
  CONFIG_FILE: E8450/im2512.config
  DIY_P1_SH: E8450/diy-part-1.sh
  DIY_P2_SH: E8450/diy-part-4.sh

  UPLOAD_BIN_DIR: "false"
  UPLOAD_FIRMWARE: "true"
  UPLOAD_RELEASE: "false"

  # ccache 命令与 OpenWrt 的 CONFIG_CCACHE_DIR 保持一致。
  CCACHE_DIR: /workdir/openwrt/.ccache

  TZ: Asia/Shanghai

  # ===== 缓存 Release 相关 (对齐 cachewrtbuild: mixkey + "-cache-openwrt") =====
  # 按分支隔离缓存，切换分支时新旧缓存可共存 7 天后自动清理。
  CACHE_PREFIX: e8450-imm-${{ github.event.inputs.branch || 'v25.12.2' }}-cache-openwrt

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 优化环境与清理磁盘空间
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          echo "Cleaning Docker..."
          docker system prune -a -f --volumes || true

          echo "Removing unused SDKs..."
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/share/swift \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/az \
            /usr/local/share/boost \
            /usr/share/gradle \
            /opt/microsoft

          echo "Installing dependencies..."
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y --no-install-recommends \
            build-essential clang llvm flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev dos2unix dwarves quilt npm jq ccache ninja-build \
            python3-setuptools rsync swig unzip zlib1g-dev file wget xsltproc zip zstd

          echo "Cleaning apt..."
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "Setting timezone..."
          sudo ln -sf "/usr/share/zoneinfo/${TZ}" /etc/localtime
          echo "${TZ}" | sudo tee /etc/timezone >/dev/null

          echo "Creating workdir..."
          sudo mkdir -p /workdir
          sudo chown "$USER":"$(id -gn)" /workdir

      # 全量克隆是必需的：缓存键依赖 git log 对 tools/toolchain 的路径过滤，
      # 浅克隆下路径过滤会退化为 HEAD 短 hash，导致缓存每次失效。
      - name: Clone source code
        working-directory: /workdir
        run: |
          set -e
          df -hT "$PWD"
          git clone --single-branch -b "$REPO_BRANCH" "$REPO_URL" openwrt
          ln -sfn /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          mkdir -p /workdir/openwrt/.ccache /workdir/openwrt/dl

      # 缓存恢复 (Toolchain + ccache + dl, 存储于 GitHub Release, 替代 cachewrtbuild)
      # key 组成与 cachewrtbuild/utils.js 一致:
      #   ${mixkey}-cache-openwrt-$(git log -n1 tools toolchain 的短 hash)
      # 全量克隆下路径过滤 git log 直接生效 (细粒度失效: 仅 tools/toolchain 变更才换 key);
      # 兜底: 极端情况下退化为 HEAD 短 hash
      - name: Restore build cache (release)
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLEAN_CACHE: ${{ github.event.inputs.clean_cache }}
        run: |
          set +e
          cd /workdir/openwrt

          TOOLCHAIN_HASH="$(git log --pretty=tformat:"%h" -n1 tools toolchain)"
          [ -z "$TOOLCHAIN_HASH" ] && TOOLCHAIN_HASH="$(git rev-parse --short HEAD)"
          CACHE_TAG="${CACHE_PREFIX}-${TOOLCHAIN_HASH}"
          echo "CACHE_TAG=${CACHE_TAG}" >> "$GITHUB_ENV"
          echo "Cache key (release tag): ${CACHE_TAG}"

          if [ "$CLEAN_CACHE" = "true" ]; then
            echo "clean_cache=true: delete all ${CACHE_PREFIX}-* releases, skip restore/save"
            gh release list -R "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' 2>/dev/null \
              | grep "^${CACHE_PREFIX}-" \
              | while IFS= read -r tag; do
                  echo "deleting cache release: $tag"
                  gh release delete "$tag" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
                done
            exit 0
          fi

          mkdir -p /tmp/cache

          if ! gh release view "$CACHE_TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Cache miss: release ${CACHE_TAG} not found, will build from scratch"
            exit 0
          fi

          if ! gh release download "$CACHE_TAG" -R "$GITHUB_REPOSITORY" \
               -D /tmp/cache \
               -p 'toolchain.tar.zst-*' -p 'ccache_topdir.tar.zst-*' -p 'dl.tar.zst-*'; then
            echo "Cache miss: download failed, will build from scratch"
            rm -rf /tmp/cache
            exit 0
          fi

          if ! ls /tmp/cache/toolchain.tar.zst-* >/dev/null 2>&1; then
            echo "Toolchain asset missing, treating as cache miss"
            rm -rf /tmp/cache
            exit 0
          fi

          mkdir -p /workdir/openwrt/staging_dir
          cat /tmp/cache/toolchain.tar.zst-* | tar -I zstd -xf - -C /workdir/openwrt
          echo "Toolchain cache restored"

          if ls /tmp/cache/ccache_topdir.tar.zst-* >/dev/null 2>&1; then
            cat /tmp/cache/ccache_topdir.tar.zst-* | tar -I zstd -xf - -C /workdir/openwrt
            echo "ccache (openwrt/.ccache) restored"
          fi

          # dl 恢复到 openwrt/dl, 供后续 make download 复用
          if ls /tmp/cache/dl.tar.zst-* >/dev/null 2>&1; then
            cat /tmp/cache/dl.tar.zst-* | tar -I zstd -xf - -C /workdir/openwrt
            echo "dl (openwrt/dl) restored"
          fi

          if ! ls -d /workdir/openwrt/staging_dir/tool* >/dev/null 2>&1; then
            echo "staging_dir/tool* NOT restored, treating as cache miss, will build toolchain from scratch"
            rm -rf /workdir/openwrt/staging_dir /tmp/cache
            exit 0
          fi

          # 与 cachewrtbuild/fetch.js 一致: 命中后 sed 跳过工具链编译
          sed -i 's/ $(tool.*\/stamp-compile)//;' Makefile
          sed -i 's/ $(tool.*\/stamp-install)//;' Makefile
          echo "Toolchain building skipped"

          # 唯一保留的校验: 确认 stamp 依赖确已被剥离
          if grep -E '^(prepare|world):.*\$\(tool(chain|s)?/stamp-' Makefile; then
            echo "WARNING: toolchain stamp dependency still present, toolchain will rebuild"
          else
            echo "ok: toolchain stamps fully stripped, toolchain will be skipped"
          fi

          rm -rf /tmp/cache
          echo "hit=1" >> "$GITHUB_OUTPUT"

      - name: Load custom feeds
        run: |
          set -e

          if [[ -e "$FEEDS_CONF" ]]; then
            mv "$FEEDS_CONF" openwrt/feeds.conf.default
          fi

          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: Update & Install feeds
        run: |
          set -e
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Fix Rust build
        run: |
          set -e
          cd openwrt
          RUST_MAKEFILE="feeds/packages/lang/rust/Makefile"

          if [[ -f "$RUST_MAKEFILE" ]]; then
            echo "Disabling Rust remote CI LLVM download."
            sed -i \
              's/--set=llvm.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/' \
              "$RUST_MAKEFILE" || true
          fi

      - name: Load custom configuration
        run: |
          set -e

          if [[ -e files ]]; then
            mv files openwrt/files
          fi

          if [[ -e "$CONFIG_FILE" ]]; then
            mv "$CONFIG_FILE" openwrt/.config
          fi

          chmod +x "$DIY_P2_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@v1.0.0
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.ssh) || (github.event_name == 'repository_dispatch' && contains(github.event.action, 'ssh')) }}
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

 
      - name: Download packages
        id: package
        run: |
          set -e
          cd openwrt

          make defconfig

          # 确保 OpenWrt 使用 ccache，并与缓存恢复/保存路径一致 ($(TOPDIR)/.ccache)。
          sed -i \
            -e '/^CONFIG_CCACHE=/d' \
            -e '/^CONFIG_CCACHE_DIR=/d' \
            .config

          cat >> .config <<'EOF'
          CONFIG_CCACHE=y
          CONFIG_CCACHE_DIR="/workdir/openwrt/.ccache"
          EOF

          make defconfig
          make download -j"$(nproc)"

          # 清理小于 1KB 的坏文件时排除 dl/go-mod-cache (锁文件/元数据小于 1KB)。
          find dl -path dl/go-mod-cache -prune -o -size -1024c -exec ls -l {} \;
          find dl -path dl/go-mod-cache -prune -o -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          set -e
          set -o pipefail
          cd openwrt

          echo "===== ccache 配置 ====="
          # 确认 CONFIG_CCACHE 在 defconfig 后仍存在 (否则 ccache 不参与编译)
          grep -E '^CONFIG_DEVEL|^CONFIG_CCACHE' .config || echo "(CONFIG_CCACHE not found in .config)"
          # OpenWrt CONFIG_CCACHE 实际使用 $(TOPDIR)/.ccache, 统计/上限必须指向真实目录
          export CCACHE_DIR=/workdir/openwrt/.ccache
          ccache -M 8G
          ccache -z

          export FORCE_UNSAFE_CONFIGURE=1

          echo "Compiling with $(($(nproc)+1)) threads..."
          make -j$(($(nproc)+1)) || make -j1 V=s

          echo "status=success" >> "$GITHUB_OUTPUT"

          grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
            | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME

          if [[ -s DEVICE_NAME ]]; then
            echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
          fi

          echo "FILE_DATE=_$(date +'%Y%m%d%H%M')" >> "$GITHUB_ENV"

          echo "===== ccache 编译统计 ====="
          ccache -s

      # 保存构建缓存 (Toolchain + ccache + dl → GitHub Release, 替代 cachewrtbuild save 阶段)
      # 单资产上限 2GiB, split 分卷后上传; 保存失败不影响构建产物 (continue-on-error)。
      - name: Save build cache (release)
        if: steps.compile.outputs.status == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLEAN_CACHE: ${{ github.event.inputs.clean_cache }}
          SKIP_SAVING: ${{ github.event.inputs.skip_saving }}
        run: |
          set -e
          cd /workdir/openwrt

          if [ "$CLEAN_CACHE" = "true" ]; then
            echo "clean_cache=true: skip saving"; exit 0
          fi
          if [ "$SKIP_SAVING" = "true" ]; then
            echo "skip_saving=true: skip saving"; exit 0
          fi

          rm -rf /tmp/cacheout && mkdir -p /tmp/cacheout
          shopt -s nullglob

          # --- 打包 ccache (zstd 多线程) ---
          echo "ccache dir size: $(du -sh /workdir/openwrt/.ccache 2>/dev/null || echo '(not found)')"
          if [ -d .ccache ]; then
            tar -I 'zstd -T0 -1' -cf /tmp/cacheout/ccache_topdir.tar.zst -C . .ccache
            echo "ccache archive: $(du -h /tmp/cacheout/ccache_topdir.tar.zst | cut -f1)"
          fi

          # --- 打包 dl (源码包本身已是压缩格式, 低级别 zstd 快速打包;
          #     排除 go-mod-cache, 防止同版本号 re-tag 依赖使用过期模块) ---
          if [ -d dl ]; then
            tar -I 'zstd -T0 -1' -cf /tmp/cacheout/dl.tar.zst \
              --exclude='dl/go-mod-cache' -C . dl
            echo "dl archive: $(du -h /tmp/cacheout/dl.tar.zst | cut -f1)"
          fi

          # --- 仅未命中时重新打包工具链 (命中时 Release 里已有, 不动) ---
          if [ "${{ steps.restore.outputs.hit }}" != "1" ]; then
            ( cd staging_dir && ls -d host* tool* 2>/dev/null ) > /tmp/tc_list
            tar -I 'zstd -T0 -3' -cf /tmp/cacheout/toolchain.tar.zst -C staging_dir $(cat /tmp/tc_list)
            echo "toolchain archive: $(du -h /tmp/cacheout/toolchain.tar.zst | cut -f1)"
          fi

          # --- 分卷 (单资产 2GiB 上限, 固定 3 位编号, 避免超过 100 卷时排序异常) ---
          cd /tmp/cacheout
          for f in *.tar.zst; do
            split -b 1900M -d -a 3 "$f" "${f}-"
            rm -f "$f"
          done
          ls -lh /tmp/cacheout

          if [ "${{ steps.restore.outputs.hit }}" = "1" ]; then
            # 命中: 工具链资产不动, 只滚动更新 ccache 与 dl 资产 (先传新, 成功后删旧)
            OLD_ASSETS="$(gh release view "$CACHE_TAG" -R "$GITHUB_REPOSITORY" \
              --json assets -q '.assets[].name' 2>/dev/null || true)"
            CCACHE_VOLS=(ccache_topdir.tar.zst-*)
            DL_VOLS=(dl.tar.zst-*)
            if [ ${#CCACHE_VOLS[@]} -gt 0 ] || [ ${#DL_VOLS[@]} -gt 0 ]; then
              UPLOAD_ARGS=("${CCACHE_VOLS[@]}" "${DL_VOLS[@]}")
              n=1
              until gh release upload "$CACHE_TAG" -R "$GITHUB_REPOSITORY" --clobber "${UPLOAD_ARGS[@]}"; do
                [ $n -ge 3 ] && { echo "upload failed after 3 attempts"; exit 1; }
                echo "attempt $n failed, retrying..."
                n=$((n+1)); sleep 10
              done
              # 只删除不在新集合中的旧分卷 (旧缓存比新的大时多出的卷)
              NEW_NAMES=" $(printf '%s ' "${UPLOAD_ARGS[@]}")"
              for a in $OLD_ASSETS; do
                case "$a" in
                  ccache_topdir.tar.zst-*|dl.tar.zst-*)
                    case "$NEW_NAMES" in
                      *" $a "*) ;;
                      *) gh release delete-asset "$CACHE_TAG" "$a" -R "$GITHUB_REPOSITORY" -y || true ;;
                    esac
                    ;;
                esac
              done
            fi
            echo "ccache + dl cache updated (toolchain unchanged)"
          else
            # 未命中: 删除旧 Release 后, 工具链 + ccache + dl 一次性重建
            gh release delete "$CACHE_TAG" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
            ASSETS=(toolchain.tar.zst-* ccache_topdir.tar.zst-* dl.tar.zst-*)
            if [ ${#ASSETS[@]} -gt 0 ]; then
              NOTES="build cache: mixkey=${CACHE_PREFIX} commit=${CACHE_TAG##*-} date=$(date -u +%FT%TZ)"
              gh release create "$CACHE_TAG" -R "$GITHUB_REPOSITORY" \
                --title "OpenWrt build cache (E8450 immortalwrt)" --notes "$NOTES" \
                "${ASSETS[@]}" \
                || echo "WARNING: cache release create failed (non-fatal)"
            fi
            echo "full cache saved (toolchain + ccache + dl)"
          fi

          # --- 清理 7 天未被复用的旧缓存 Release (保留 7 天窗口以支持 branch 切换共存) ---
          echo "===== 清理旧缓存 Release ====="
          gh release list -R "$GITHUB_REPOSITORY" --json tagName,createdAt \
            | jq -r --arg p "${CACHE_PREFIX}-" --arg cur "$CACHE_TAG" \
                '.[] | select(.tagName | startswith($p)) | select(.tagName != $cur) | [.createdAt, .tagName] | @tsv' \
            | while IFS=$'\t' read -r created old_tag; do
                age=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 86400 ))
                if [ "$age" -ge 7 ]; then
                  echo "deleting stale cache release (${age}d old): $old_tag"
                  gh release delete "$old_tag" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
                fi
              done
          echo "===== 清理完毕 ====="

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: ${{ steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true' }}
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize firmware files
        id: organize
        if: ${{ env.UPLOAD_FIRMWARE == 'true' && !cancelled() }}
        run: |
          set -euo pipefail

          mapfile -t TARGET_DIRS < <(
            find openwrt/bin/targets -mindepth 2 -maxdepth 2 -type d
          )

          if [[ "${#TARGET_DIRS[@]}" -ne 1 ]]; then
            echo "Expected one firmware target directory; found ${#TARGET_DIRS[@]}."
            printf '%s\n' "${TARGET_DIRS[@]}"
            exit 1
          fi

          cd "${TARGET_DIRS[0]}"
          rm -rf packages

          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: ${{ steps.organize.outputs.status == 'success' && !cancelled() }}
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      # 编译失败时自动保存日志
      - name: Upload compile logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: openwrt-build-logs
          path: |
            openwrt/logs/
            openwrt/.config

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 3
