name: LINKSYS-MT7621 WRT

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      branch:
        description: "WRT Branch"
        required: true
        default: '25.04_b202507121539'
      ssh:
        description: "开启 SSH 调试"
        type: boolean
        default: false

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: ${{ github.event.inputs.branch || '25.04_b202507121539' }}
  CONFIG_FILE: EA7500/x.config
  DIY_P1_SH: EA7500/diy-part1.sh
  DIY_P2_SH: EA7500/diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4 

    - name: 🚀 精简版环境优化与依赖安装
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 移除无用镜像与工具链缓存
        docker rmi $(docker images -q) || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        
        sudo -E apt-get -qq update
        # 仅安装 OpenWrt 编译的核心补丁包与 MergerFS
        sudo -E apt-get -qq install ccache mergerfs clang llvm flex bison gawk \
            gettext libncurses-dev libz-dev libssl-dev dos2unix dwarves quilt npm jq \
            python3-setuptools python3-pyelftools python3-dev rsync swig zlib1g-dev \
            xsltproc zstd asciidoc patch subversion uglifyjs p7zip-full msmtp texinfo \
            libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool \
            autopoint device-tree-compiler tzdata
        
        sudo npm install -g pnpm
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: 设置工作目录
      run: |
        WORK_DIR="$GITHUB_WORKSPACE/openwrt"
        mkdir -p "$WORK_DIR"
        echo "WORK_DIR=$WORK_DIR" >> $GITHUB_ENV
        

    - name: Clone source code
      run: |
        git clone --depth 1 --single-branch -b $REPO_BRANCH $REPO_URL $WORK_DIR
        ln -sf $WORK_DIR $GITHUB_WORKSPACE/openwrt

    - name: Cache OpenWrt downloads
      uses: actions/cache@v4
      with:
        path: ${{ env.WORK_DIR }}/dl
        key: dl-${{ hashFiles('${{ env.WORK_DIR }}/feeds.conf.default') }}
        restore-keys: dl-

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ${{ env.WORK_DIR }}/.ccache
        key: ccache-${{ github.sha }}
        restore-keys: ccache-   

        
    - name: Load custom feeds
      run: |
        cd $WORK_DIR
        chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Update feeds
      run: |
        cd $WORK_DIR
        ./scripts/feeds update -a

    - name: Install feeds
      run: |
        cd $WORK_DIR
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        cd $WORK_DIR
        [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ] && cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
        [ -d "$GITHUB_WORKSPACE/files" ] && cp -r "$GITHUB_WORKSPACE/files" .

        chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd $WORK_DIR
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd $WORK_DIR
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: env.UPLOAD_BIN_DIR == 'true'
      with:
        name: WRT_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd $WORK_DIR/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
