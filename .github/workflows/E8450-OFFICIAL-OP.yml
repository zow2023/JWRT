name: E8450-OFFICIAL-OP

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      branch:
        description: "openwrt Branch"
        required: true
        default: 'v25.12.4'

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: ${{ github.event.inputs.branch || 'v25.12.4' }}
  FEEDS_CONF: E8450/feeds.conf.default
  CONFIG_FILE: E8450/25125official.config
  DIY_P1_SH: E8450/diy-part-1.sh
  DIY_P2_SH: E8450/diy-part-2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space (Clean Environment)
        run: |
          # 1) 清理 Docker 镜像与容器
          docker system prune -a -f --volumes || true

          # 2) 快速删除大型预装环境 (瞬间释放 30GB+ 空间)
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/share/swift \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/az \
            /usr/local/share/boost

          # 3) 清理残留包本体与配置文件
          sudo -E apt-get -y purge \
            azure-cli \
            'ghc*' \
            'zulu*' \
            firefox \
            'google*' \
            'dotnet*' \
            powershell \
            'openjdk*' \
            'mysql*' \
            'php*' || true

          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          # 4) 查看清理后的可用空间
          df -h

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils build-essential bzip2 \
            clang device-tree-compiler dwarves flex gawk gcc-multilib gettext git \
            libglib2.0-dev libncurses5-dev libssl-dev libtool libz-dev jq ccache ninja-build \
            libc6-dev-i386 llvm msmtp npm p7zip p7zip-full patch python3-dev \
            python3-pyelftools qemu-utils subversion texinfo tzdata uglifyjs \
            unzip upx xmlto zlib1g-dev mergerfs

          sudo npm install -g pnpm
          sudo -E apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo timedatectl set-timezone "$TZ"

          # 创建工作目录
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Cache OpenWrt Build
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: true
          toolchain: true
          skip: true
          prefix: /workdir/openwrt
          mixkey: E8450-25125official          

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Fix Rust build
        run: |
          cd openwrt
          RUST_MAKEFILE="feeds/packages/lang/rust/Makefile"
          if [ -f "$RUST_MAKEFILE" ]; then
            echo "===== 禁用 Rust 远程 CI LLVM 下载 (防 404 报错) ====="
            sed -i 's/--set=llvm.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/' "$RUST_MAKEFILE" || true
          fi

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@v1.0.0
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Patch Kernel Config
        run: |
          cd openwrt
          chmod +x ./scripts/config
          for cfg in $(find target/linux/mediatek -name "config-6*"); do
            ./scripts/config --file "$cfg" \
              -e CONFIG_NET_SCH_BPF \
              -e CONFIG_BPF_SYSCALL \
              -e CONFIG_BPF_JIT \
              -e CONFIG_NETKIT \
              -e CONFIG_NF_CONNTRACK_CHAIN_EVENTS
          done

      - name: Download package
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j"$(nproc)"
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      
      - name: Cache Go Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-
         
      - name: Compile the firmware
        id: compile
        run: |
          set -o pipefail
          cd openwrt
          echo "===== 配置 ccache ====="
          mkdir -p ~/.ccache
          ccache -M 5G
          ccache -z
          echo -e "$(nproc) thread compile"
          make -j"$(nproc)" || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

          echo "===== ccache 编译统计 ====="
          ccache -s

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 3

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.0
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
