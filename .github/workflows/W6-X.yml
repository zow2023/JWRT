#

name: W6-X-OP

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      branch:
        description: 'X-WRT Branch'
        required: true
        default: '26.04_b202607300654'
      ssh:
        description: 'Actions SSH debug'
        required: false
        default: 'false'

# 工具链缓存存 Release 需要 GITHUB_TOKEN 有 contents:write（gh release create/upload/delete），
# delete-workflow-runs 需要 actions:write。
permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/x-wrt/x-wrt.git
  REPO_BRANCH: ${{ github.event.inputs.branch || '26.04_b202607300654' }}
  FEEDS_CONF: W6/feeds.conf.default
  CONFIG_FILE: W6/w6x.config
  DIY_P1_SH: W6/diy-part1.sh
  DIY_P2_SH: W6/diy-part5.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai
  CACHE_PREFIX: openwrt-w6-x-cache-openwrt

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🚀 优化环境与清理空间
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 1) 清理 Docker 深度占用
          docker system prune -a -f --volumes || true

          # 2) 深度清理预装无用的大型工具包 (释放 30GB+ 空间)
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/share/swift \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/az \
            /usr/local/share/boost \
            /usr/local/.ghcup

          # 3) 安装构建依赖与配置时区
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y --no-install-recommends \
            build-essential clang llvm flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev dos2unix dwarves quilt npm jq ccache ninja-build \
            python3-setuptools rsync swig unzip zlib1g-dev file wget xsltproc zip zstd

          # [改动] 删除 pnpm 安装：OpenWrt 构建链路不依赖它
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo timedatectl set-timezone "$TZ"

          # 4) 创建工作目录
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Restore build cache (release)
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cd /workdir/openwrt

          TOOLCHAIN_HASH=$(git log --pretty=tformat:"%h" -n1 tools toolchain)
          [ -z "$TOOLCHAIN_HASH" ] && TOOLCHAIN_HASH=$(git rev-parse --short HEAD)
          CACHE_TAG="${CACHE_PREFIX}-${TOOLCHAIN_HASH}"
          echo "CACHE_TAG=${CACHE_TAG}" >> $GITHUB_ENV
          echo "Cache key (release tag): ${CACHE_TAG}"

          if [ "${{ github.event.inputs.clean_cache }}" = "true" ]; then
            echo "clean_cache=true: skip restore, deleting cache release ${CACHE_TAG}"
            gh release delete "$CACHE_TAG" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
            exit 0
          fi

          mkdir -p /tmp/cache

          if ! gh release view "$CACHE_TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Cache miss: release ${CACHE_TAG} not found, will build from scratch"
            exit 0
          fi

          if ! gh release download "$CACHE_TAG" -R "$GITHUB_REPOSITORY" \
               -D /tmp/cache -p 'toolchain.tar.gz-*' -p 'ccache_*.tar.gz-*'; then
            echo "Cache miss: download failed, will build from scratch"
            rm -rf /tmp/cache
            exit 0
          fi

          if ! ls /tmp/cache/toolchain.tar.gz-* >/dev/null 2>&1; then
            echo "Toolchain asset missing, treating as cache miss"
            rm -rf /tmp/cache
            exit 0
          fi

          echo "--- tarball preview (top 5 entries) ---"
          tar tzf "$(ls /tmp/cache/toolchain.tar.gz-* | head -1)" | head -5

          mkdir -p /workdir/openwrt/staging_dir
          cat /tmp/cache/toolchain.tar.gz-* | tar xzf - -C /workdir/openwrt/staging_dir
          echo "Toolchain cache restored"

          if ls /tmp/cache/ccache_topdir.tar.gz-* >/dev/null 2>&1; then
            cat /tmp/cache/ccache_topdir.tar.gz-* | tar xzf - -C /workdir/openwrt
            echo "ccache (openwrt/.ccache) restored"
          fi

          if ! ls -d /workdir/openwrt/staging_dir/tool* >/dev/null 2>&1; then
            echo "staging_dir/tool* NOT restored, treating as cache miss, will build toolchain from scratch"
            rm -rf /tmp/cache
            exit 0
          fi

          # 与 cachewrtbuild/fetch.js 一致: 命中后 sed 跳过工具链编译
          sed -i 's/ $(tool.*\/stamp-compile)//;' Makefile
          sed -i 's/ $(tool.*\/stamp-install)//;' Makefile
          echo "Toolchain building skipped"

          echo "===== restore verify ====="
          ls -d /workdir/openwrt/staging_dir/host* /workdir/openwrt/staging_dir/tool* 2>/dev/null || echo "(no host*/tool* dirs)"
          du -sh /workdir/openwrt/staging_dir 2>/dev/null || echo "(du failed)"
          if grep -E '^(prepare|world):.*\$\(tool(chain|s)?/stamp-' Makefile; then
            echo "WARNING: toolchain stamp dependency still present, toolchain will rebuild"
          else
            echo "ok: toolchain stamps fully stripped, toolchain will be skipped"
          fi
          ls -la /workdir/openwrt/.ccache 2>/dev/null | head -5 || echo "(no openwrt/.ccache)"
          echo "===== verify done ====="

          rm -rf /tmp/cache
          echo "hit=1" >> $GITHUB_OUTPUT

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Replace Rust feed with guaranteed CI LLVM
        run: |
          cd /workdir/openwrt
          rm -rf feeds/packages/lang/rust
          git clone --depth 1 https://github.com/sbwml/packages_lang_rust.git feeds/packages/lang/rust
          ./scripts/feeds install -f rust

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@v1.0.0
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}


      - name: Patch Kernel Config
        run: |
          cd openwrt
          for cfg in $(find target/linux/mediatek -name "config-6*"); do
            echo "Checking $cfg"
            sed -i '/CONFIG_NET_SCH_BPF/d' "$cfg"
            echo "CONFIG_NET_SCH_BPF=y" >> "$cfg"
            sed -i '/CONFIG_BPF_SYSCALL/d' "$cfg"
            echo "CONFIG_BPF_SYSCALL=y" >> "$cfg"
            sed -i '/CONFIG_BPF_JIT/d' "$cfg"
            echo "CONFIG_BPF_JIT=y" >> "$cfg"
            sed -i '/CONFIG_NETKIT/d' "$cfg"
            echo "CONFIG_NETKIT=y" >> "$cfg"
            sed -i '/CONFIG_NF_CONNTRACK_CHAIN_EVENTS/d' "$cfg"
            echo "CONFIG_NF_CONNTRACK_CHAIN_EVENTS=y" >> "$cfg"
          done

      - name: Prepare Toolchain cache key
        working-directory: /workdir/openwrt
        run: |
          set -euo pipefail

          SAFE_BRANCH="$(printf '%s' "$REPO_BRANCH" | sed -E 's/[^A-Za-z0-9._-]+/-/g' | cut -c1-24)"

          # 使用 tools/ 与 toolchain/ 的 Git tree 对象哈希，避免普通源码提交
          # 或软件包选择变化导致工具链缓存失效。
          TOOLCHAIN_SOURCE_HASH="$(
            {
              git rev-parse HEAD:tools
              git rev-parse HEAD:toolchain
            } | sha256sum | cut -c1-12
          )"

          # 只纳入架构、ABI、C 库、GCC/Binutils、BPF/LLVM 等工具链相关选项。
          # 普通 CONFIG_PACKAGE_* 与 CONFIG_CCACHE_DIR 不参与此哈希。
          # 注意：TARGET_mediatek(_[A-Za-z0-9]+)? 覆盖 mt7981/mt7986/mt7988/filogic 等子目标。
          TOOLCHAIN_CONFIG_HASH="$(
            grep -E '^(# )?CONFIG_(ARCH|ARCH_64BIT|BIG_ENDIAN|aarch64|arm|mipsel|TARGET_BOARD|TARGET_SUBTARGET|TARGET_mediatek(_[A-Za-z0-9]+)?|TARGET_ARCH_PACKAGES|TARGET_OPTIMIZATION|TARGET_CPU|CPU_TYPE|CPU_SUBTYPE|SOFT_FLOAT|USE_MIPS16|TOOLCHAINOPTS|EXTERNAL_TOOLCHAIN|NATIVE_TOOLCHAIN|EXTERNAL_GCC_VERSION|EXTERNAL_TOOLCHAIN_LIBC_USE_(GLIBC|MUSL)|TOOLCHAIN_(LIBC|PREFIX|ROOT|INC_PATH|LIB_PATH|BIN_PATH)|EXTRA_TARGET_ARCH(_NAME|_OPTS)?|MIPS64_ABI_(N64|N32|O32)|LIBC_USE_(GLIBC|MUSL)|USE_(GLIBC|MUSL)|MUSL_DISABLE_CRYPT_SIZE_HACK|GCC_USE_VERSION_[0-9]+|GCC_USE_GRAPHITE|EXTRA_GCC_CONFIG_OPTIONS|GCC_DEFAULT_(PIE|SSP)|SJLJ_EXCEPTIONS|INSTALL_(GFORTRAN|GCCGO)|BINUTILS_USE_VERSION_[0-9_]+|EXTRA_BINUTILS_CONFIG_OPTIONS|BPF_TOOLCHAIN(_NONE|_PREBUILT|_BUILD_LLVM|_HOST|_HOST_PATH)?|HAS_PREBUILT_LLVM_TOOLCHAIN|USE_LLVM_(HOST|BUILD|PREBUILT)|DWARVES|GDB(_PYTHON)?|NASM)(=.*| is not set)$' .config \
              | LC_ALL=C sort \
              | sha256sum \
              | cut -c1-12
          )"

          TOOLCHAIN_TAG="toolchain-w6-v1-${SAFE_BRANCH}-${TOOLCHAIN_SOURCE_HASH}-${TOOLCHAIN_CONFIG_HASH}"

          echo "SAFE_BRANCH=${SAFE_BRANCH}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_SOURCE_HASH=${TOOLCHAIN_SOURCE_HASH}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_CONFIG_HASH=${TOOLCHAIN_CONFIG_HASH}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_TAG=${TOOLCHAIN_TAG}" >> "$GITHUB_ENV"

          echo "Toolchain source hash: ${TOOLCHAIN_SOURCE_HASH}"
          echo "Toolchain config hash: ${TOOLCHAIN_CONFIG_HASH}"
          echo "Toolchain cache tag: ${TOOLCHAIN_TAG}"

      # 工具链持久化到 Release：不受 actions/cache 7 天过期与 10GB 配额限制。
      - name: Restore Toolchain from Release
        id: restore-toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DOWNLOAD_DIR="/tmp/toolchain-cache"
          mkdir -p "$DOWNLOAD_DIR"

          echo "Checking Toolchain Release: ${TOOLCHAIN_TAG}"

          if ! gh release download "$TOOLCHAIN_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "toolchain.tar.zst" \
            --dir "$DOWNLOAD_DIR"; then
            echo "No usable Toolchain Release found; building Toolchain from source."
            echo "TOOLCHAIN_EXISTS=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if ! tar -I zstd -xf "$DOWNLOAD_DIR/toolchain.tar.zst" -C /workdir/openwrt; then
            echo "Toolchain archive could not be extracted; rebuilding it."
            rm -rf /workdir/openwrt/staging_dir/host* /workdir/openwrt/staging_dir/tool*
            echo "TOOLCHAIN_EXISTS=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # 确认归档里确实有工具链目录。
          shopt -s nullglob
          HOST_PATHS=(/workdir/openwrt/staging_dir/host*)
          TOOL_PATHS=(/workdir/openwrt/staging_dir/tool*)

          if (( ${#HOST_PATHS[@]} == 0 || ${#TOOL_PATHS[@]} == 0 )); then
            echo "Toolchain archive is missing staging_dir/host* or staging_dir/tool*."
            rm -rf /workdir/openwrt/staging_dir/host* /workdir/openwrt/staging_dir/tool*
            echo "TOOLCHAIN_EXISTS=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # 恢复成功后，从顶层 Makefile 移除工具链 stamp 依赖，跳过工具链编译。
          # [改动] 先检查目标模式是否存在：上游 Makefile 结构变化导致 sed 失效时
          # 给出明确告警（后果只是工具链重编，慢但正确），避免静默失效。
          cd /workdir/openwrt
          if grep -qE '\$\(tool[^)]*\/stamp-(compile|install)\)' Makefile; then
            sed -i -E 's/ \$\(tool[^)]*\/stamp-(compile|install)\)//g' Makefile
            echo "Toolchain stamp deps removed from Makefile."
          else
            echo "WARNING: toolchain stamp deps not found in Makefile — sed patch is stale, toolchain will rebuild."
          fi

          echo "TOOLCHAIN_EXISTS=true" >> "$GITHUB_ENV"
          echo "Toolchain cache restored and toolchain build dependencies skipped."

      - name: Download packages
        run: |
          cd openwrt
          make defconfig
          mkdir -p dl
          find dl -size -1024c -exec rm -f {} \;
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          set -o pipefail
          cd openwrt

          echo "===== ccache 配置 ====="
          # 确认 CONFIG_CCACHE 在 defconfig 后仍存在 (否则 ccache 不参与编译)
          grep -E '^CONFIG_DEVEL|^CONFIG_CCACHE' .config
          # OpenWrt CONFIG_CCACHE 实际使用 $(TOPDIR)/.ccache, 统计/上限必须指向真实目录
          export CCACHE_DIR=/workdir/openwrt/.ccache
          ccache -M 8G
          ccache -z

          export FORCE_UNSAFE_CONFIGURE=1
          export MAKEFLAGS="-j$(($(nproc)+1))"

          make -j$(($(nproc)+1)) || make -j1 V=s
          
          echo "status=success" >> $GITHUB_OUTPUT
          
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV


      - name: ccache diagnostics
        if: always()
        run: |
          export CCACHE_DIR=/workdir/openwrt/.ccache
          echo "===== 构建时真实生效的 CCACHE 配置 (来自 rules.mk) ====="
          cd /workdir/openwrt
          make -pn 2>/dev/null | grep -E '^export CCACHE' || echo "(none)"
          echo "===== 当前 shell 环境 CCACHE 配置 (仅供参考) ====="
          ccache -p | grep -Ei 'sloppiness|compiler_check|base_dir|hash_dir|cache_dir'
          echo "===== 详细统计 ====="
          ccache -sv || ccache -s
          echo "===== miss 原因聚类 (如启用 CCACHE_LOGFILE) ====="
          grep -oE 'result: miss [^ ]*' /tmp/ccache.log 2>/dev/null | sort | uniq -c | sort -rn | head -20 || echo "(no ccache.log; enable CCACHE_LOGFILE in compile step)"    

      - name: Save build cache (release)
        if: steps.compile.outputs.status == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd /workdir/openwrt
          CACHE_TAG="${CACHE_TAG:-${CACHE_PREFIX}-$(git rev-parse --short HEAD)}"
          echo "Saving cache to release: ${CACHE_TAG}"
          if [ "${{ github.event.inputs.clean_cache }}" = "true" ]; then
            echo "clean_cache=true: skip saving"; exit 0
          fi
          if [ "${{ github.event.inputs.skip_saving }}" = "true" ]; then
            echo "skip_saving=true: skip saving"; exit 0
          fi
          rm -rf /tmp/cacheout && mkdir -p /tmp/cacheout
          echo "ccache dir size: $(du -sh /workdir/openwrt/.ccache 2>/dev/null || echo '(not found)')"
          # --- 打包工具链 ---
          if compgen -G "staging_dir/host*" > /dev/null || compgen -G "staging_dir/tool*" > /dev/null; then
            ( cd staging_dir && ls -d host* tool* 2>/dev/null ) > /tmp/tc_list
            tar czf /tmp/cacheout/toolchain.tar.gz -C staging_dir $(cat /tmp/tc_list)
            echo "toolchain archive: $(du -h /tmp/cacheout/toolchain.tar.gz | cut -f1)"
          fi
          # --- 打包 ccache ---
          if [ -d .ccache ]; then
            tar czf /tmp/cacheout/ccache_topdir.tar.gz -C . .ccache
            echo "ccache_topdir archive: $(du -h /tmp/cacheout/ccache_topdir.tar.gz | cut -f1)"
          fi
          # --- 分卷 (固定3位编号, 避免超过100卷时排序异常) ---
          cd /tmp/cacheout
          for f in toolchain.tar.gz ccache_topdir.tar.gz; do
            if [ -f "$f" ]; then
              split -b 1900M -d -a 3 "$f" "${f}-"
              rm -f "$f"
            fi
          done
          ls -lh /tmp/cacheout
          if [ "${{ steps.restore.outputs.hit }}" = "1" ]; then
            # 命中: 工具链 key 未变, 只滚动更新 ccache 资产 (先传新、成功后删旧, API 失败不中断)
            OLD_CCACHE_NAMES=$(gh release view "$CACHE_TAG" -R "$GITHUB_REPOSITORY" \
              --json assets -q '.assets[].name' 2>/dev/null \
              | grep '^ccache_' | tr '\n' ' ' || true)
            if ls ccache_topdir.tar.gz-* >/dev/null 2>&1; then
              NEW_NAMES=$(ls ccache_topdir.tar.gz-* | xargs -n1 basename | tr '\n' ' ')
              # --clobber 覆盖同名资产; 失败重试 3 次
              n=1
              until gh release upload "$CACHE_TAG" -R "$GITHUB_REPOSITORY" --clobber ccache_topdir.tar.gz-*; do
                [ $n -ge 3 ] && { echo "upload failed after 3 attempts"; exit 1; }
                echo "attempt $n failed, retrying..."
                n=$((n+1)); sleep 10
              done
              # 只删除不在新集合中的旧分卷 (旧缓存比新的大时多出的卷)
              for a in $OLD_CCACHE_NAMES; do
                case " $NEW_NAMES " in
                  *" $a "*) ;;
                  *) gh release delete-asset "$CACHE_TAG" "$a" -R "$GITHUB_REPOSITORY" -y || true ;;
                esac
              done
            fi
            echo "ccache cache updated (toolchain unchanged)"
          else
            # 未命中: 删除旧 Release 后整体重建 (工具链 + ccache)
            gh release delete "$CACHE_TAG" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
            NOTES="build cache: mixkey=openwrt-w6-v25.12 commit=${CACHE_TAG##*-} date=$(date -u +%FT%TZ)"
            if ls toolchain.tar.gz-* ccache_topdir.tar.gz-* >/dev/null 2>&1; then
              gh release create "$CACHE_TAG" -R "$GITHUB_REPOSITORY" \
                --title "OpenWrt build cache (W6)" --notes "$NOTES" \
                toolchain.tar.gz-* ccache_topdir.tar.gz-* 2>/dev/null \
              || gh release create "$CACHE_TAG" -R "$GITHUB_REPOSITORY" \
                --title "OpenWrt build cache (W6)" --notes "$NOTES" \
                toolchain.tar.gz-* 2>/dev/null \
              || gh release create "$CACHE_TAG" -R "$GITHUB_REPOSITORY" \
                --title "OpenWrt build cache (W6)" --notes "$NOTES" \
                ccache_topdir.tar.gz-*
            fi
            echo "full cache saved"
          fi
          # --- 清理 7 天未被复用的旧缓存 Release (保留 7 天窗口以支持 branch 切换共存) ---
          echo "===== 清理旧缓存 Release ====="
          gh release list -R "$GITHUB_REPOSITORY" --json tagName,createdAt \
            | jq -r --arg p "${CACHE_PREFIX}-" --arg cur "$CACHE_TAG" \
                '.[] | select(.tagName | startswith($p)) | select(.tagName != $cur) | [.createdAt, .tagName] | @tsv' \
            | while IFS=$'\t' read -r created old_tag; do
                age=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 86400 ))
                if [ "$age" -ge 7 ]; then
                  echo "deleting stale cache release (${age}d old): $old_tag"
                  gh release delete "$old_tag" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
                fi
              done
          echo "===== 清理完毕 ====="


      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 3
