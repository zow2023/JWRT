name: W6-X-OP

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      branch:
        description: 'X-WRT Branch'
        required: true
        default: '26.04_b202607300654'
      ssh:
        description: 'Actions SSH debug'
        required: false
        default: 'false'
      # [保留自第二份] 第一份的步骤里引用了这两个输入却从未声明，属于无效功能；此处补全声明
      clean_cache:
        description: '清空远端工具链缓存后重建 (true/false)'
        required: false
        default: 'false'
      skip_saving:
        description: '本次结果不回写缓存 (true/false)'
        required: false
        default: 'false'

# 工具链缓存存 Release 需要 GITHUB_TOKEN 有 contents:write（gh release create/upload/delete），
# delete-workflow-runs 需要 actions:write。
permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/x-wrt/x-wrt.git
  REPO_BRANCH: ${{ github.event.inputs.branch || '26.04_b202607300654' }}
  FEEDS_CONF: W6/feeds.conf.default
  CONFIG_FILE: W6/w6x.config
  DIY_P1_SH: W6/diy-part1.sh
  DIY_P2_SH: W6/diy-part5.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai
  DEBIAN_FRONTEND: noninteractive
  # 缓存命名空间前缀：所有缓存 Release 均为 ${CACHE_PREFIX}-<源码哈希>-<配置哈希>
  # [保留第二份的单一 key 体系] 第一份同时存在 CACHE_TAG 与 TOOLCHAIN_TAG 两套互不兼容的
  # 缓存 key（tag 格式、压缩格式、分卷方式均对不上），其 "Restore Toolchain from Release"
  # 与 "Prepare Toolchain cache key" 是永久 miss 的死步骤，已整体移除。
  CACHE_PREFIX: openwrt-w6-x-cache-openwrt
  # 过期缓存 Release 回收天数（保留窗口以支持 branch 切换共存）
  CACHE_RETENTION_DAYS: '7'

jobs:
  build:
    runs-on: ubuntu-latest
    # [保留自第二份] 防止同 branch 并发构建竞争同一个缓存 Release（排队而不是取消）
    concurrency:
      group: w6x-build-${{ github.event.inputs.branch || 'default' }}
      cancel-in-progress: false
    # [保留自第二份] 显式留出 save 阶段窗口（GitHub 托管 runner 上限 360 分钟）
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🚀 优化环境与清理空间
        run: |
          docker system prune -a -f --volumes || true
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/share/swift \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/az \
            /usr/local/share/boost \
            /usr/local/.ghcup
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y --no-install-recommends \
            build-essential clang llvm flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev dos2unix dwarves quilt npm jq ccache ninja-build \
            python3-setuptools rsync swig unzip zlib1g-dev file wget xsltproc zip zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Replace Rust feed with guaranteed CI LLVM
        run: |
          cd /workdir/openwrt
          rm -rf feeds/packages/lang/rust
          # TODO: 建议固定到已知可用的 commit SHA，避免上游漂移导致偶发失败
          git clone --depth 1 https://github.com/sbwml/packages_lang_rust.git feeds/packages/lang/rust
          ./scripts/feeds install -f rust

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@v1.0.0
        if: github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh')
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Patch Kernel Config
        run: |
          cd openwrt
          for cfg in $(find target/linux/mediatek -name "config-6*"); do
            echo "Checking $cfg"
            sed -i '/CONFIG_NET_SCH_BPF/d' "$cfg"
            echo "CONFIG_NET_SCH_BPF=y" >> "$cfg"
            sed -i '/CONFIG_BPF_SYSCALL/d' "$cfg"
            echo "CONFIG_BPF_SYSCALL=y" >> "$cfg"
            sed -i '/CONFIG_BPF_JIT/d' "$cfg"
            echo "CONFIG_BPF_JIT=y" >> "$cfg"
            sed -i '/CONFIG_NETKIT/d' "$cfg"
            echo "CONFIG_NETKIT=y" >> "$cfg"
            sed -i '/CONFIG_NF_CONNTRACK_CHAIN_EVENTS/d' "$cfg"
            echo "CONFIG_NF_CONNTRACK_CHAIN_EVENTS=y" >> "$cfg"
          done

      # [关键顺序，保留自第二份] 先 make defconfig 展开 .config，再计算缓存 key；
      # 第一份在 defconfig 之前 grep 未展开的配置，且 set -euo pipefail 下 grep 无匹配
      # 会直接令整个 job 失败——该缺陷随死步骤一并移除。
      - name: Expand config (make defconfig)
        working-directory: /workdir/openwrt
        run: make defconfig

      # [key 设计，保留自第二份]
      # - 只用 tools/ 与 toolchain/ 的 Git tree 对象哈希：源码其他部分或软件包选择
      #   变化不会使工具链缓存失效；不掺 branch 名，跨快照分支可共享同一份缓存。
      #   （第一份生效路径用 git log 提交哈希做 key，任何触及 tools/toolchain 的提交都会
      #   使缓存整体失效——弃用。）
      # - 只纳入工具链相关选项（此时 .config 已 make defconfig 展开）。
      #   普通 CONFIG_PACKAGE_* 与 CONFIG_CCACHE_DIR 不参与此哈希。
      #   注意：TARGET_mediatek(_[A-Za-z0-9]+)? 覆盖 mt7981/mt7986/mt7988/filogic 等子目标。
      - name: Prepare Toolchain cache key
        working-directory: /workdir/openwrt
        run: |
          set -euo pipefail
          TOOLCHAIN_SOURCE_HASH="$(
            {
              git rev-parse HEAD:tools
              git rev-parse HEAD:toolchain
            } | sha256sum | cut -c1-12
          )"
          # || true 兜底：即使 grep 无匹配也不允许 key 步骤炸掉整个 job（吸收第一份的教训）
          TOOLCHAIN_CONFIG_HASH="$(
            (grep -E '^(# )?CONFIG_(ARCH|ARCH_64BIT|BIG_ENDIAN|aarch64|arm|mipsel|TARGET_BOARD|TARGET_SUBTARGET|TARGET_mediatek(_[A-Za-z0-9]+)?|TARGET_ARCH_PACKAGES|TARGET_OPTIMIZATION|TARGET_CPU|CPU_TYPE|CPU_SUBTYPE|SOFT_FLOAT|USE_MIPS16|TOOLCHAINOPTS|EXTERNAL_TOOLCHAIN|NATIVE_TOOLCHAIN|EXTERNAL_GCC_VERSION|EXTERNAL_TOOLCHAIN_LIBC_USE_(GLIBC|MUSL)|TOOLCHAIN_(LIBC|PREFIX|ROOT|INC_PATH|LIB_PATH|BIN_PATH)|EXTRA_TARGET_ARCH(_NAME|_OPTS)?|MIPS64_ABI_(N64|N32|O32)|LIBC_USE_(GLIBC|MUSL)|USE_(GLIBC|MUSL)|MUSL_DISABLE_CRYPT_SIZE_HACK|GCC_USE_VERSION_[0-9]+|GCC_USE_GRAPHITE|EXTRA_GCC_CONFIG_OPTIONS|GCC_DEFAULT_(PIE|SSP)|SJLJ_EXCEPTIONS|INSTALL_(GFORTRAN|GCCGO)|BINUTILS_USE_VERSION_[0-9_]+|EXTRA_BINUTILS_CONFIG_OPTIONS|BPF_TOOLCHAIN(_NONE|_PREBUILT|_BUILD_LLVM|_HOST|_HOST_PATH)?|HAS_PREBUILT_LLVM_TOOLCHAIN|USE_LLVM_(HOST|BUILD|PREBUILT)|DWARVES|GDB(_PYTHON)?|NASM)(=.*| is not set)$' .config || true) \
              | LC_ALL=C sort \
              | sha256sum \
              | cut -c1-12
          )"
          # [关键] 必须带 CACHE_PREFIX 前缀，清理逻辑才能匹配到；否则缓存会无限堆积
          # （第一份的 toolchain-w6-v1-* tag 不带前缀，一旦产生将成为清理盲区——弃用该命名。）
          TOOLCHAIN_TAG="${CACHE_PREFIX}-${TOOLCHAIN_SOURCE_HASH}-${TOOLCHAIN_CONFIG_HASH}"
          echo "TOOLCHAIN_SOURCE_HASH=${TOOLCHAIN_SOURCE_HASH}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_CONFIG_HASH=${TOOLCHAIN_CONFIG_HASH}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_TAG=${TOOLCHAIN_TAG}" >> "$GITHUB_ENV"
          echo "Toolchain source hash: ${TOOLCHAIN_SOURCE_HASH}"
          echo "Toolchain config hash: ${TOOLCHAIN_CONFIG_HASH}"
          echo "Toolchain cache tag:   ${TOOLCHAIN_TAG}"

      # [唯一缓存机制：Release 化的 cachewrtbuild 策略]
      # - 保留第二份的增量编译核心（与 cachewrtbuild/fetch.js 同源）：
      #   命中缓存后从顶层 Makefile 剥离 toolchain stamp 依赖，跳过工具链编译；
      #   sed 补丁失效时显式降级为 miss，save 阶段整体重传自愈
      #   （第一份命中路径只打 WARNING 仍置 hit=1，坏缓存永远不会被修复——弃用该行为）。
      # - 已移除第一份的 "Restore build cache (release)"（旧 CACHE_TAG/gzip 体系）与
      #   "Restore Toolchain from Release"（永不命中的死步骤），全流程仅此一套缓存。
      - name: Restore Toolchain + ccache (Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ "${{ github.event.inputs.clean_cache }}" = "true" ]; then
            echo "clean_cache=true: 删除缓存 Release ${TOOLCHAIN_TAG} 并跳过恢复"
            gh release delete "$TOOLCHAIN_TAG" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
            echo "TOOLCHAIN_EXISTS=false" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p /tmp/tcache
          if ! gh release download "$TOOLCHAIN_TAG" -R "$GITHUB_REPOSITORY" \
               -D /tmp/tcache -p 'toolchain.tar.zst-*' -p 'ccache.tar.zst-*'; then
            echo "Cache miss: ${TOOLCHAIN_TAG} 不存在或下载失败, 将完整编译工具链"
            rm -rf /tmp/tcache
            echo "TOOLCHAIN_EXISTS=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! ls /tmp/tcache/toolchain.tar.zst-* >/dev/null 2>&1; then
            echo "Cache miss: 工具链分卷缺失, 将完整编译工具链"
            rm -rf /tmp/tcache
            echo "TOOLCHAIN_EXISTS=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! cat /tmp/tcache/toolchain.tar.zst-* | tar -I zstd -xf - -C /workdir/openwrt; then
            echo "工具链解压失败, 按缓存未命中处理"
            rm -rf /workdir/openwrt/staging_dir /workdir/openwrt/build_dir/host* \
                   /workdir/openwrt/build_dir/hostpkg /workdir/openwrt/tmp/.build
            rm -rf /tmp/tcache
            echo "TOOLCHAIN_EXISTS=false" >> "$GITHUB_ENV"
            exit 0
          fi
          shopt -s nullglob
          HOST_PATHS=(/workdir/openwrt/staging_dir/host*)
          TOOL_PATHS=(/workdir/openwrt/staging_dir/tool*)
          if (( ${#HOST_PATHS[@]} == 0 || ${#TOOL_PATHS[@]} == 0 )); then
            echo "Cache miss: 解压后缺少 staging_dir/host* 或 tool*"
            rm -rf /workdir/openwrt/staging_dir
            rm -rf /tmp/tcache
            echo "TOOLCHAIN_EXISTS=false" >> "$GITHUB_ENV"
            exit 0
          fi
          shopt -u nullglob
          if ls /tmp/tcache/ccache.tar.zst-* >/dev/null 2>&1; then
            if cat /tmp/tcache/ccache.tar.zst-* | tar -I zstd -xf - -C /workdir/openwrt; then
              echo "ccache 已恢复: $(du -sh /workdir/openwrt/.ccache 2>/dev/null | cut -f1)"
            fi
          fi
          rm -rf /tmp/tcache
          # 与 cachewrtbuild 一致: 命中后从顶层 Makefile 剥离工具链 stamp 依赖
          cd /workdir/openwrt
          if grep -qE '\$\(tool[^)]*\/stamp-(compile|install)\)' Makefile; then
            sed -i -E 's/ \$\(tool[^)]*\/stamp-(compile|install)\)//g' Makefile
            echo "Toolchain stamp 依赖已剥离, 工具链编译将跳过"
            echo "TOOLCHAIN_EXISTS=true" >> "$GITHUB_ENV"
          else
            # 补丁失效时显式降级为 miss：本轮照常重编工具链，save 阶段整体重传自愈
            echo "::warning::顶层 Makefile 未找到工具链 stamp 依赖, sed 补丁已过期, 工具链将完整重编"
            echo "TOOLCHAIN_EXISTS=false" >> "$GITHUB_ENV"
          fi
          echo "===== restore verify ====="
          du -sh /workdir/openwrt/staging_dir 2>/dev/null || true
          ls -d /workdir/openwrt/staging_dir/host* /workdir/openwrt/staging_dir/tool* 2>/dev/null | head -6 || true
          [ -d /workdir/openwrt/build_dir/host ] && echo "build_dir/host 已恢复" || echo "WARNING: build_dir/host 未恢复"
          [ -d /workdir/openwrt/tmp/.build ] && echo "tmp/.build stamps 已恢复" || true
          echo "===== verify done ====="

      - name: Download packages
        working-directory: /workdir/openwrt
        run: |
          make defconfig
          mkdir -p dl
          find dl -size -1024c -exec rm -f {} \; || true
          # [保留自第二份] 下载失败先清理残缺文件再单线程重试（第一份无重试，弃用其行为）
          make download -j8 || {
            find dl -size -1024c -exec rm -f {} \;
            make download -j1 V=s
          }
          find dl -size -1024c -exec rm -f {} \; || true

      - name: Compile the firmware
        id: compile
        working-directory: /workdir/openwrt
        run: |
          set -o pipefail
          echo "===== ccache 配置 ====="
          grep -E '^CONFIG_CCACHE=y' .config || echo "::warning::CONFIG_CCACHE 未启用, ccache 不参与本次编译"
          # 与 rules.mk 一致 (TOPDIR/.ccache)；此导出仅供 ccache CLI 使用, make 内部由 rules.mk 决定
          export CCACHE_DIR=/workdir/openwrt/.ccache
          # [合并自第一份] 上限从 6G 提到 8G：actions/cache 的 10GB 配额不适用于 Release 资产，
          # 8G 能显著降低大改动时的 miss 率
          ccache -M 8G
          ccache -z
          export FORCE_UNSAFE_CONFIGURE=1
          make -j$(($(nproc)+1)) || make -j1 V=s

          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: ccache diagnostics
        if: always()
        working-directory: /workdir/openwrt
        run: |
          export CCACHE_DIR=/workdir/openwrt/.ccache
          echo "===== make 内真实生效的 CCACHE 导出 (rules.mk) ====="
          make -pn 2>/dev/null | grep -E '^export CCACHE' || echo "(none)"
          echo "===== shell 侧配置 (仅供参考) ====="
          ccache -p 2>/dev/null | grep -Ei 'cache_dir|max_size|sloppiness|compiler_check|base_dir|hash_dir' || true
          echo "===== 统计 ====="
          ccache -sv || ccache -s || true
          grep -oE 'result: miss [^ ]*' /tmp/ccache.log 2>/dev/null | sort | uniq -c | sort -rn | head -20 \
            || echo "(no ccache.log; 需要在编译步骤 export CCACHE_LOGFILE 才能采集)"

      # [save 阶段] 与 restore 共用 TOOLCHAIN_TAG 一个 Release，全流程唯一缓存机制。
      # 工具链持久化到 Release：不受 actions/cache 7 天过期与 10GB 配额限制。
      # 相比第二份的修复：只打包实际存在的目录，任一路径缺失不再导致 tar 非零退出
      # 而 set -e 把整个缓存回写静默吞掉。
      - name: Save Toolchain + ccache (Release)
        if: steps.compile.outputs.status == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: /workdir/openwrt
        run: |
          set -e
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          if [ "${{ github.event.inputs.clean_cache }}" = "true" ]; then
            echo "clean_cache=true: 跳过回写"; exit 0
          fi
          if [ "${{ github.event.inputs.skip_saving }}" = "true" ]; then
            echo "skip_saving=true: 跳过回写"; exit 0
          fi
          rm -rf /tmp/cacheout && mkdir -p /tmp/cacheout
          echo "ccache dir: $(du -sh .ccache 2>/dev/null || echo '(not found)')"
          # --- 打包工具链: staging_dir(host/tool) + build_dir(host) + tmp/.build stamps ---
          # build_dir/host 是 host 工具实际产物目录, 缺了它恢复后仍会重编 host 工具
          # [健壮性修复] 只打包实际存在的目录：空目录缺失时 tar 不再非零退出导致整包静默失败。
          #   若你确认 tmp/.build 中含有非工具链步骤的 stamp，可从 CANDIDATES 中移除该路径
          #   （多跑一次 target prepare 比跳过不该跳过的步骤安全）。
          shopt -s nullglob
          CANDIDATES=(staging_dir/host staging_dir/hostpkg staging_dir/tool-*
                      build_dir/host build_dir/hostpkg tmp/.build)
          TPATHS=()
          for p in "${CANDIDATES[@]}"; do
            if [ -e "$p" ]; then TPATHS+=("$p"); fi
          done
          shopt -u nullglob
          if [ ${#TPATHS[@]} -gt 0 ]; then
            tar -cf - "${TPATHS[@]}" | zstd -T0 -3 -o /tmp/cacheout/toolchain.tar.zst
            echo "toolchain archive: $(du -h /tmp/cacheout/toolchain.tar.zst | cut -f1)"
          else
            echo "::warning::没有可打包的工具链目录, 本轮仅回写 ccache"
          fi
          if [ -d .ccache ]; then
            tar -cf - .ccache | zstd -T0 -3 -o /tmp/cacheout/ccache.tar.zst
            echo "ccache archive: $(du -h /tmp/cacheout/ccache.tar.zst | cut -f1)"
          fi
          # --- 分卷 (Release 单资产上限 2GiB, 留余量; 固定3位编号避免超100卷排序异常) ---
          cd /tmp/cacheout
          for f in toolchain.tar.zst ccache.tar.zst; do
            [ -f "$f" ] || continue
            split -b 1900M -d -a 3 "$f" "${f}-"
            rm -f "$f"
          done
          ls -lh /tmp/cacheout
          if [ "$TOOLCHAIN_EXISTS" = "true" ]; then
            # 命中: 工具链未变, 只滚动更新 ccache 分卷 (先传新、成功后删旧)
            OLD_CCACHE_NAMES=$(gh release view "$TOOLCHAIN_TAG" -R "$GITHUB_REPOSITORY" \
              --json assets -q '.assets[].name' 2>/dev/null | grep '^ccache' | tr '\n' ' ' || true)
            if ls ccache.tar.zst-* >/dev/null 2>&1; then
              NEW_NAMES=$(ls ccache.tar.zst-* | xargs -n1 basename | tr '\n' ' ')
              n=1
              until gh release upload "$TOOLCHAIN_TAG" -R "$GITHUB_REPOSITORY" --clobber ccache.tar.zst-*; do
                [ $n -ge 3 ] && { echo "ccache 上传失败 (重试 3 次)"; exit 1; }
                echo "attempt $n failed, retrying..."; n=$((n+1)); sleep 10
              done
              for a in $OLD_CCACHE_NAMES; do
                case " $NEW_NAMES " in
                  *" $a "*) ;;
                  *) gh release delete-asset "$TOOLCHAIN_TAG" "$a" -R "$GITHUB_REPOSITORY" -y || true ;;
                esac
              done
              echo "命中: ccache 已滚动更新 (工具链资产保持不变)"
            else
              echo "命中: 本次无 ccache 产物, 跳过"
            fi
          else
            # 未命中: 删旧建新, 工具链 + ccache 整体保存
            gh release delete "$TOOLCHAIN_TAG" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
            NOTES="build cache: tag=${TOOLCHAIN_TAG} commit=${COMMIT_SHORT} date=$(date -u +%FT%TZ)"
            ASSETS=()
            compgen -G "toolchain.tar.zst-*" >/dev/null && ASSETS+=(toolchain.tar.zst-*)
            compgen -G "ccache.tar.zst-*" >/dev/null && ASSETS+=(ccache.tar.zst-*)
            if [ ${#ASSETS[@]} -gt 0 ]; then
              gh release create "$TOOLCHAIN_TAG" -R "$GITHUB_REPOSITORY" \
                --title "OpenWrt build cache (W6)" --notes "$NOTES" "${ASSETS[@]}"
              echo "未命中: 已完整保存工具链 + ccache"
            else
              echo "没有可保存的缓存产物"
            fi
          fi
          # --- 清理过期缓存 Release (自动回收旧格式与跨分支遗留; --limit 200 防漏扫) ---
          echo "===== 清理过期缓存 Release ====="
          gh release list -R "$GITHUB_REPOSITORY" --json tagName,createdAt --limit 200 \
            | jq -r --arg p "${CACHE_PREFIX}-" --arg cur "$TOOLCHAIN_TAG" \
                '.[] | select(.tagName | startswith($p)) | select(.tagName != $cur) | [.createdAt, .tagName] | @tsv' \
            | while IFS=$'\t' read -r created old_tag; do
                age=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 86400 ))
                if [ "$age" -ge "$CACHE_RETENTION_DAYS" ]; then
                  echo "deleting stale cache release (${age}d): $old_tag"
                  gh release delete "$old_tag" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
                fi
              done
          echo "===== 清理完毕 ====="

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 3
