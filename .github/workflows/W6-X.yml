# Description: Build X-WRT OpenWrt for Acer Predator W6 using GitHub Actions (Optimized)
#

name: W6-X-OP

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      branch:
        description: 'X-WRT Branch'
        required: true
        default: '26.04_b202607300654'
      ssh:
        description: 'Actions SSH debug'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/x-wrt/x-wrt.git
  REPO_BRANCH: ${{ github.event.inputs.branch || '26.04_b202607300654' }}
  FEEDS_CONF: W6/feeds.conf.default
  CONFIG_FILE: W6/w6x.config
  DIY_P1_SH: W6/diy-part1.sh
  DIY_P2_SH: W6/diy-part5.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🚀 优化环境与清理空间
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 1) 清理 Docker 深度占用
          docker system prune -a -f --volumes || true

          # 2) 深度清理预装无用的大型工具包 (释放 30GB+ 空间)
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/share/swift \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/az \
            /usr/local/share/boost \
            /usr/local/.ghcup

          # 3) 安装构建依赖与配置时区
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y --no-install-recommends \
            build-essential clang llvm flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev dos2unix dwarves quilt npm jq ccache ninja-build \
            python3-setuptools rsync swig unzip zlib1g-dev file wget xsltproc zip zstd

          sudo npm install -g pnpm
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo timedatectl set-timezone "$TZ"

          # 4) 创建工作目录
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Cache OpenWrt Build
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: true
          toolchain: true
          skip: true
          prefix: /workdir/openwrt
          mixkey: w6x
          
      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Replace Rust feed with guaranteed CI LLVM
        run: |
          cd /workdir/openwrt
          rm -rf feeds/packages/lang/rust
          git clone --depth 1 https://github.com/sbwml/packages_lang_rust.git feeds/packages/lang/rust
          ./scripts/feeds install -f rust        

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@v1.0.0
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Patch Kernel Config
        run: |
          cd openwrt
          ALL_CFG=$(find target/linux/generic target/linux/mediatek -name "config-6*" | sort)
          echo "=== 待处理片段 ==="
          echo "$ALL_CFG"

          # 1) 打印修改前状态（Actions 日志可核对）
          for cfg in $ALL_CFG; do
            echo "--- BEFORE $cfg ---"
            grep -nE 'CONFIG_(NET_SCH_BPF|BPF_SYSCALL|BPF_JIT|NETKIT|NF_CONNTRACK_CHAIN_EVENTS|CGROUPS|SOCK_CGROUP_DATA|CGROUP_BPF)\b' "$cfg" || echo "(无相关行)"
          done

          # 2) 从 generic 和 target 片段中删除相关行
          #    （含 "# CONFIG_CGROUP_BPF is not set"——这是上次失败的元凶）
          for cfg in $ALL_CFG; do
            sed -i -E '/CONFIG_(NET_SCH_BPF|BPF_SYSCALL|BPF_JIT|NETKIT|NF_CONNTRACK_CHAIN_EVENTS|CGROUPS|SOCK_CGROUP_DATA|CGROUP_BPF)\b/d' "$cfg"
          done

          # 3) 向 target 片段追加 =y
          for cfg in $(find target/linux/mediatek -name "config-6*"); do
            cat >> "$cfg" <<'EOF'
          CONFIG_NET_SCH_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_NETKIT=y
          CONFIG_NF_CONNTRACK_CHAIN_EVENTS=y
          CONFIG_CGROUPS=y
          CONFIG_SOCK_CGROUP_DATA=y
          CONFIG_CGROUP_BPF=y
          EOF
          done

          # 4) 打印修改后状态
          for cfg in $ALL_CFG; do
            echo "--- AFTER $cfg ---"
            grep -nE 'CONFIG_(CGROUPS|SOCK_CGROUP_DATA|CGROUP_BPF)\b' "$cfg" || echo "(无相关行)"
          done


      - name: Download package
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j"$(nproc)"
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          set -o pipefail
          cd openwrt

          echo "===== 配置 ccache ====="
          mkdir -p ~/.ccache
          ccache -M 5G
          ccache -z
          
          echo -e "$(nproc) thread compile"
          make -j"$(nproc)" || make -j1 || make -j1 V=s

          echo "===== 验证 CGROUP_BPF 进入最终内核配置 ====="
          KCFG=$(find build_dir -maxdepth 4 -path '*linux*' -name .config | head -n1)
          echo "最终内核配置: $KCFG"
          grep -E 'CONFIG_(CGROUPS|SOCK_CGROUP_DATA|CGROUP_BPF)=' "$KCFG" \
            || { echo "!!! CGROUP_BPF 未生效，构建中止，请检查日志 !!!"; exit 1; }

          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

          echo "===== ccache 编译统计 ====="
          ccache -s

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 3

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.0
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
