name: W6-MTK-OP

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

# 避免相同工作流并发运行时争抢/覆盖同一份 Toolchain Release 与构建缓存。
concurrency:
  group: w6-mtk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  REPO_URL: https://github.com/zow2023/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  FEEDS_CONF: W6/feeds.conf.default
  CONFIG_FILE: W6/mtkw6.config
  DIY_P1_SH: W6/diy-part1.sh
  DIY_P2_SH: W6/diy-part4.sh
  UPLOAD_BIN_DIR: 'false'
  UPLOAD_FIRMWARE: 'true'
  # 与下方 ccache 缓存路径保持一致。
  CCACHE_DIR: /workdir/openwrt/.ccache
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Optimize Environment & Free Space
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          echo 'Cleaning Docker...'
          docker system prune -a -f --volumes || true

          echo 'Removing unused large SDKs...'
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/ghc \
            /opt/az \
            /opt/microsoft \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/gradle

          echo 'Installing build dependencies...'
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y --no-install-recommends \
            build-essential clang llvm flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            dos2unix dwarves quilt npm jq ccache ninja-build \
            python3 python3-pip python3-setuptools \
            rsync swig unzip zlib1g-dev file wget xsltproc zip zstd

          sudo npm install -g pnpm
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*

          sudo timedatectl set-timezone "$TZ"

          # Runner 每次使用全新虚拟机，只需设置 /workdir 本身的权限。
          sudo mkdir -p /workdir
          sudo chown "$USER":"$(id -gn)" /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          set -euo pipefail
          df -hT "$PWD"

          # 工具链缓存键改用 git tree 哈希计算，不再依赖 git log，
          # 因此可以浅克隆以加快速度。
          git clone --depth 1 --single-branch -b "$REPO_BRANCH" "$REPO_URL" openwrt
          ln -sfn /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          mkdir -p /workdir/openwrt/dl /workdir/openwrt/.ccache

      # ccache 走 actions/cache；即使超过 7 天未访问被驱逐，
      # 工具链仍可从 Release 恢复，损失可控。
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/.ccache
          # 每次运行使用新 key，否则精确命中后 actions/cache 不会保存更新后的 ccache。
          key: ccache-${{ runner.os }}-w6-${{ env.REPO_BRANCH }}-${{ hashFiles('W6/mtkw6.config', 'W6/feeds.conf.default', 'W6/diy-part1.sh', 'W6/diy-part4.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          # 同分支回退到最新的历史缓存，普通软件包配置变化仍可复用 ccache。
          restore-keys: |
            ccache-${{ runner.os }}-w6-${{ env.REPO_BRANCH }}-
            ccache-${{ runner.os }}-w6-

      - name: Load custom feeds
        run: |
          set -euo pipefail
          if [[ -e "$FEEDS_CONF" ]]; then
            mv "$FEEDS_CONF" openwrt/feeds.conf.default
          fi
          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: Update feeds
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds update -a

      - name: Install feeds
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          set -euo pipefail
          if [[ -e files ]]; then
            mv files openwrt/files
          fi
          if [[ -e "$CONFIG_FILE" ]]; then
            mv "$CONFIG_FILE" openwrt/.config
          fi
          chmod +x "$DIY_P2_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@v1.0.0
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      # 对源码和 feeds 的当前提交生成下载缓存指纹；版本变化时产生新缓存，
      # 避免旧归档永久不更新。
      - name: Prepare download cache key
        working-directory: /workdir/openwrt
        run: |
          set -euo pipefail

          DOWNLOAD_SOURCE_HASH="$(
            {
              printf 'openwrt %s\n' "$(git rev-parse HEAD)"
              while IFS= read -r -d '' git_entry; do
                repo="${git_entry%/.git}"
                if [[ -d "$repo" && -e "$repo/.git" ]]; then
                  commit="$(git -C "$repo" rev-parse HEAD 2>/dev/null || printf unknown)"
                  printf '%s %s\n' "${repo#/workdir/openwrt/}" "$commit"
                fi
              done < <(find feeds package -name .git -print0)
            } | LC_ALL=C sort | sha256sum | cut -c1-12
          )"

          echo "DOWNLOAD_SOURCE_HASH=${DOWNLOAD_SOURCE_HASH}" >> "$GITHUB_ENV"
          echo "Download source hash: ${DOWNLOAD_SOURCE_HASH}"

      # 缓存 make download 获取的源码归档，减少每次运行的重复网络下载。
      - name: Cache OpenWrt download sources
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: dl-${{ runner.os }}-w6-${{ env.REPO_BRANCH }}-${{ env.DOWNLOAD_SOURCE_HASH }}-${{ hashFiles('W6/mtkw6.config', 'W6/feeds.conf.default', 'W6/diy-part1.sh', 'W6/diy-part4.sh') }}
          restore-keys: |
            dl-${{ runner.os }}-w6-${{ env.REPO_BRANCH }}-
            dl-${{ runner.os }}-w6-

      - name: Download packages
        id: package
        run: |
          set -euo pipefail
          cd openwrt

          make defconfig

          # 确保 OpenWrt 使用 ccache，并与工作流缓存目录一致。
          sed -i \
            -e '/^CONFIG_CCACHE=/d' \
            -e '/^CONFIG_CCACHE_DIR=/d' \
            .config

          cat >> .config <<'EOF'
          CONFIG_CCACHE=y
          CONFIG_CCACHE_DIR="/workdir/openwrt/.ccache"
          EOF

          make defconfig
          make download -j"$(nproc)"

          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # 只根据工具链源码和真正影响工具链的 .config 项生成缓存标签。
      # 放在 make defconfig 与软件包下载之后，保证读取的是规范化后的最终配置。
      - name: Prepare Toolchain cache key
        working-directory: /workdir/openwrt
        run: |
          set -euo pipefail

          SAFE_BRANCH="$(printf '%s' "$REPO_BRANCH" | sed -E 's/[^A-Za-z0-9._-]+/-/g' | cut -c1-24)"

          # 使用 tools/ 与 toolchain/ 的 Git tree 对象哈希，避免普通源码提交
          # 或软件包选择变化导致工具链缓存失效。
          TOOLCHAIN_SOURCE_HASH="$(
            {
              git rev-parse HEAD:tools
              git rev-parse HEAD:toolchain
            } | sha256sum | cut -c1-12
          )"

          # 只纳入架构、ABI、C 库、GCC/Binutils、BPF/LLVM 等工具链相关选项。
          # 普通 CONFIG_PACKAGE_* 与 CONFIG_CCACHE_DIR 不参与此哈希。
          # 注意：TARGET_mediatek(_[A-Za-z0-9]+)? 覆盖 mt7981/mt7986/mt7988/filogic 等子目标。
          TOOLCHAIN_CONFIG_HASH="$(
            grep -E '^(# )?CONFIG_(ARCH|ARCH_64BIT|BIG_ENDIAN|aarch64|arm|mipsel|TARGET_BOARD|TARGET_SUBTARGET|TARGET_mediatek(_[A-Za-z0-9]+)?|TARGET_ARCH_PACKAGES|TARGET_OPTIMIZATION|TARGET_CPU|CPU_TYPE|CPU_SUBTYPE|SOFT_FLOAT|USE_MIPS16|TOOLCHAINOPTS|EXTERNAL_TOOLCHAIN|NATIVE_TOOLCHAIN|EXTERNAL_GCC_VERSION|EXTERNAL_TOOLCHAIN_LIBC_USE_(GLIBC|MUSL)|TOOLCHAIN_(LIBC|PREFIX|ROOT|INC_PATH|LIB_PATH|BIN_PATH)|EXTRA_TARGET_ARCH(_NAME|_OPTS)?|MIPS64_ABI_(N64|N32|O32)|LIBC_USE_(GLIBC|MUSL)|USE_(GLIBC|MUSL)|MUSL_DISABLE_CRYPT_SIZE_HACK|GCC_USE_VERSION_[0-9]+|GCC_USE_GRAPHITE|EXTRA_GCC_CONFIG_OPTIONS|GCC_DEFAULT_(PIE|SSP)|SJLJ_EXCEPTIONS|INSTALL_(GFORTRAN|GCCGO)|BINUTILS_USE_VERSION_[0-9_]+|EXTRA_BINUTILS_CONFIG_OPTIONS|BPF_TOOLCHAIN(_NONE|_PREBUILT|_BUILD_LLVM|_HOST|_HOST_PATH)?|HAS_PREBUILT_LLVM_TOOLCHAIN|USE_LLVM_(HOST|BUILD|PREBUILT)|DWARVES|GDB(_PYTHON)?|NASM)(=.*| is not set)$' .config \
              | LC_ALL=C sort \
              | sha256sum \
              | cut -c1-12
          )"

          TOOLCHAIN_TAG="toolchain-w6-v1-${SAFE_BRANCH}-${TOOLCHAIN_SOURCE_HASH}-${TOOLCHAIN_CONFIG_HASH}"

          echo "SAFE_BRANCH=${SAFE_BRANCH}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_SOURCE_HASH=${TOOLCHAIN_SOURCE_HASH}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_CONFIG_HASH=${TOOLCHAIN_CONFIG_HASH}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_TAG=${TOOLCHAIN_TAG}" >> "$GITHUB_ENV"

          echo "Toolchain source hash: ${TOOLCHAIN_SOURCE_HASH}"
          echo "Toolchain config hash: ${TOOLCHAIN_CONFIG_HASH}"
          echo "Toolchain cache tag: ${TOOLCHAIN_TAG}"

      # 工具链持久化到 Release：不受 actions/cache 7 天过期与 10GB 配额限制。
      - name: Restore Toolchain from Release
        id: restore-toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DOWNLOAD_DIR="/tmp/toolchain-cache"
          mkdir -p "$DOWNLOAD_DIR"

          echo "Checking Toolchain Release: ${TOOLCHAIN_TAG}"

          if ! gh release download "$TOOLCHAIN_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "toolchain.tar.zst" \
            --dir "$DOWNLOAD_DIR"; then
            echo "No usable Toolchain Release found; building Toolchain from source."
            echo "TOOLCHAIN_EXISTS=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if ! tar -I zstd -xf "$DOWNLOAD_DIR/toolchain.tar.zst" -C /workdir/openwrt; then
            echo "Toolchain archive could not be extracted; rebuilding it."
            rm -rf /workdir/openwrt/staging_dir/host* /workdir/openwrt/staging_dir/tool*
            echo "TOOLCHAIN_EXISTS=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # 确认归档里确实有工具链目录。
          shopt -s nullglob
          HOST_PATHS=(/workdir/openwrt/staging_dir/host*)
          TOOL_PATHS=(/workdir/openwrt/staging_dir/tool*)

          if (( ${#HOST_PATHS[@]} == 0 || ${#TOOL_PATHS[@]} == 0 )); then
            echo "Toolchain archive is missing staging_dir/host* or staging_dir/tool*."
            rm -rf /workdir/openwrt/staging_dir/host* /workdir/openwrt/staging_dir/tool*
            echo "TOOLCHAIN_EXISTS=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # 恢复成功后，从顶层 Makefile 移除工具链 stamp 依赖，跳过工具链编译。
          cd /workdir/openwrt
          sed -i 's/ $(tool.*\/stamp-compile)//;' Makefile
          sed -i 's/ $(tool.*\/stamp-install)//;' Makefile

          echo "TOOLCHAIN_EXISTS=true" >> "$GITHUB_ENV"
          echo "Toolchain cache restored and toolchain build dependencies skipped."

      - name: Compile the firmware
        id: compile
        timeout-minutes: 360
        run: |
          set -euo pipefail
          cd openwrt

          echo "===== Configure ccache ====="
          mkdir -p "$CCACHE_DIR"
          ccache -M 5G
          ccache -z

          echo "===== Compile using $(nproc) threads ====="
          make -j"$(nproc)" || make -j1 || make -j1 V=s

          echo 'status=success' >> "$GITHUB_OUTPUT"

          grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
            | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          if [[ -s DEVICE_NAME ]]; then
            echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
          fi
          echo "FILE_DATE=_$(date +'%Y%m%d%H%M')" >> "$GITHUB_ENV"

          echo '===== ccache statistics ====='
          ccache -s

      # 仅在本次为冷编译（未命中工具链缓存）且编译成功时，保存工具链到 Release。
      - name: Save Toolchain to Release
        id: save-toolchain
        if: ${{ steps.compile.outputs.status == 'success' && env.TOOLCHAIN_EXISTS != 'true' && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /workdir/openwrt

          shopt -s nullglob
          CACHE_PATHS=(staging_dir/host* staging_dir/tool*)

          if (( ${#CACHE_PATHS[@]} == 0 )); then
            echo "No staging_dir/host* or staging_dir/tool* paths found; cannot save Toolchain cache."
            exit 1
          fi

          echo "Packing Toolchain cache paths: ${CACHE_PATHS[*]}"
          tar -I 'zstd -3' -cf toolchain.tar.zst "${CACHE_PATHS[@]}"

          if gh release view "$TOOLCHAIN_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists; replacing its Toolchain asset."
            gh release upload "$TOOLCHAIN_TAG" toolchain.tar.zst \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Creating Toolchain Release."
            gh release create "$TOOLCHAIN_TAG" toolchain.tar.zst \
              --repo "$GITHUB_REPOSITORY" \
              --title "Toolchain Cache (${TOOLCHAIN_TAG})" \
              --notes "OpenWrt Toolchain cache (staging_dir/host* and staging_dir/tool*)."
          fi

      # 工具链升级换代后，删除与当前 tag 不匹配的旧 toolchain-* Release，
      # 避免缓存 Release 无限堆积。
      - name: Delete stale Toolchain Releases
        if: ${{ steps.compile.outputs.status == 'success' && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Current Toolchain tag: ${TOOLCHAIN_TAG}"
          echo "Removing stale toolchain releases..."

          STALE_TAGS="$(
            gh release list --repo "$GITHUB_REPOSITORY" \
              --limit 100 --json tagName --jq '.[].tagName' \
              | grep -E '^toolchain-w6-v1-' \
              | grep -v -F "${TOOLCHAIN_TAG}" || true
          )"

          if [[ -z "$STALE_TAGS" ]]; then
            echo "No stale Toolchain releases found."
            exit 0
          fi

          while IFS= read -r stale_tag; do
            [[ -z "$stale_tag" ]] && continue
            echo "Deleting stale release: ${stale_tag}"
            gh release delete "$stale_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag --yes
          done <<< "$STALE_TAGS"

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          set -euo pipefail

          mapfile -t TARGET_DIRS < <(
            find openwrt/bin/targets -mindepth 2 -maxdepth 2 -type d
          )

          if [[ "${#TARGET_DIRS[@]}" -ne 1 ]]; then
            echo "Expected one firmware target directory; found ${#TARGET_DIRS[@]}."
            printf '%s\n' "${TARGET_DIRS[@]}"
            exit 1
          fi

          cd "${TARGET_DIRS[0]}"
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo 'status=success' >> "$GITHUB_OUTPUT"

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 3
