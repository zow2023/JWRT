name: W6-MTK-OP

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      clean_cache:
        description: 'Clean build cache (delete cache release, skip restore/save)'
        required: false
        default: 'false'
      skip_saving:
        description: 'Skip saving build cache'
        required: false
        default: 'false'

# 必需:保存/删除缓存 Release 需要 contents: write
permissions:
  contents: write

env:
  REPO_URL: https://github.com/zow2023/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  FEEDS_CONF: W6/feeds.conf.default
  CONFIG_FILE: W6/mtkw6.config
  DIY_P1_SH: W6/diy-part1.sh
  DIY_P2_SH: W6/diy-part4.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai
  # ===== 缓存 Release 相关(严格对齐 cachewrtbuild 的 key 组成) =====
  CACHE_PREFIX: w6-mtkw6-cache-openwrt   # = mixkey + "-cache-openwrt"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4 

    - name: 🚀 Optimize Environment & Free Space
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 预先深度清理大件垃圾，最大化编译可用空间
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /usr/local/.ghcup \
          /opt/ghc \
          /usr/local/share/boost \
          /opt/hostedtoolcache/CodeQL

        sudo apt-get -qq update
        sudo apt-get -qq install -y \
          build-essential clang llvm flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git \
          libncurses5-dev libssl-dev libelf-dev \
          dos2unix dwarves quilt npm jq ccache ninja-build \
          python3 python3-pip python3-setuptools \
          rsync swig unzip zlib1g-dev file wget xsltproc zip zstd

        sudo npm install -g pnpm
        sudo apt-get clean
        sudo timedatectl set-timezone "$TZ"
        
        # 修正工作目录权限，使用 -R 递归并采用标准 runner 用户
        sudo mkdir -p /workdir
        sudo chown -R runner:runner /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # ============================================================
    # 替代 klever1988/cachewrtbuild@main 的 fetch 阶段
    # key 组成与 utils.js 完全一致:
    #   ${mixkey}-cache-openwrt-$(git log -n1 tools toolchain 的 hash)
    # 命中后执行与 fetch.js 相同的 sed, 跳过工具链编译
    # ============================================================
    - name: Restore build cache (release)
      id: restore
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set +e
        cd /workdir/openwrt

        # --- 与 cachewrtbuild/utils.js 完全一致的 key 计算 ---
        TOOLCHAIN_HASH=$(git log --pretty=tformat:"%h" -n1 tools toolchain)
        CACHE_TAG="${CACHE_PREFIX}-${TOOLCHAIN_HASH}"
        echo "CACHE_TAG=${CACHE_TAG}" >> $GITHUB_ENV
        echo "Cache key (release tag): ${CACHE_TAG}"

        # --- clean: true 对齐上游 clean 输入: 跳过还原并删除缓存 Release ---
        if [ "${{ github.event.inputs.clean_cache }}" = "true" ]; then
          echo "clean=true: skip restore, deleting cache release ${CACHE_TAG}"
          gh release delete "$CACHE_TAG" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          exit 0
        fi

        mkdir -p /tmp/cache

        # --- Release 不存在时按未命中处理, 走完整编译 ---
        if ! gh release view "$CACHE_TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          echo "Cache miss: release ${CACHE_TAG} not found, will build from scratch"
          exit 0
        fi

        # --- 下载缓存资产 (必须用 -D: 同时下 工具链 + ccache 卷) ---
        if ! gh release download "$CACHE_TAG" -R "$GITHUB_REPOSITORY" \
             -D /tmp/cache -p 'toolchain.tar.gz-*' -p 'ccache_*.tar.gz-*'; then
          echo "Cache miss: download failed, will build from scratch"
          rm -rf /tmp/cache
          exit 0
        fi

        # --- 工具链资产缺失时按未命中处理 ---
        if ! ls /tmp/cache/toolchain.tar.gz-* >/dev/null 2>&1; then
          echo "Toolchain asset missing, treating as cache miss"
          rm -rf /tmp/cache
          exit 0
        fi

        # --- 排查用: 打印 tar 包内前几个条目, 确认路径前缀 ---
        echo "--- tarball preview (top 5 entries) ---"
        tar tzf "$(ls /tmp/cache/toolchain.tar.gz-* | head -1)" | head -5

        # 工具链归档由 save 侧用 -C staging_dir 打包, 此处对称解压
        mkdir -p /workdir/openwrt/staging_dir
        cat /tmp/cache/toolchain.tar.gz-* | tar xzf - -C /workdir/openwrt/staging_dir
        echo "Toolchain cache restored"

        # --- 还原 ccache (OpenWrt CONFIG_CCACHE 实际使用 $(TOPDIR)/.ccache) ---
        if ls /tmp/cache/ccache_topdir.tar.gz-* >/dev/null 2>&1; then
          cat /tmp/cache/ccache_topdir.tar.gz-* | tar xzf - -C /workdir/openwrt
          echo "ccache (openwrt/.ccache) restored"
        fi

        # ==================================================================
        # 关键: 只有 staging_dir 真正还原出了 toolchain 才算命中, 才跳过编译
        # ==================================================================
        if ! ls -d /workdir/openwrt/staging_dir/tool* >/dev/null 2>&1; then
          echo "staging_dir/tool* NOT restored, treating as cache miss, will build toolchain from scratch"
          rm -rf /tmp/cache
          exit 0
        fi

        # --- 命中确认: 改 Makefile 跳过工具链编译 (与 fetch.js 一致) ---
        sed -i 's/ $(tool.*\/stamp-compile)//;' Makefile
        sed -i 's/ $(tool.*\/stamp-install)//;' Makefile
        echo "Toolchain building skipped"

        # --- 验证还原 (全部兜底, 不会中止脚本) ---
        echo "===== restore verify ====="
        echo "--- staging_dir ---"
        ls -d /workdir/openwrt/staging_dir/host* /workdir/openwrt/staging_dir/tool* 2>/dev/null || echo "(no host*/tool* dirs)"
        du -sh /workdir/openwrt/staging_dir 2>/dev/null || echo "(du failed)"

        # 精确检查依赖引用 (规则定义行不算残留, 避免误报)
        echo "--- Makefile toolchain stamp 检查 ---"
        if grep -nE '\$\(tool(chain|s)?/stamp-(compile|install)\)' Makefile; then
          echo "WARNING: toolchain stamp dependency still present, toolchain will rebuild"
        else
          echo "ok: toolchain stamps fully stripped, toolchain will be skipped"
        fi

        echo "--- ccache 还原 ---"
        ls -la /workdir/openwrt/.ccache 2>/dev/null | head -5 || echo "(no openwrt/.ccache)"
        echo "===== verify done ====="

        rm -rf /tmp/cache
        echo "hit=1" >> $GITHUB_OUTPUT

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      timeout-minutes: 360
      run: |
        set -o pipefail
        cd openwrt

        echo "===== ccache 配置 ====="
        # 确认 CONFIG_CCACHE 真的在 defconfig 后的 .config 里 (否则 ccache 不参与编译)
        grep -E '^CONFIG_DEVEL|^CONFIG_CCACHE' .config
        # OpenWrt CONFIG_CCACHE 使用 $(TOPDIR)/.ccache, 统计/上限必须指向真实目录
        export CCACHE_DIR=/workdir/openwrt/.ccache
        ccache -M 8G
        ccache -z
        
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        
        echo "status=success" >> $GITHUB_OUTPUT
        
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

        echo "===== ccache 编译统计 (真实目录) ====="
        ccache -s | head -15

    # ============================================================
    # 替代 klever1988/cachewrtbuild@main 的 save(post) 阶段
    # 打包内容与 utils.js 完全一致: staging_dir/host* + staging_dir/tool* (+ .ccache)
    # 单资产上限 2GiB, 用 split 分卷后上传到缓存 Release
    # ============================================================
    - name: Save build cache (release)
      if: steps.compile.outputs.status == 'success'
      # 对齐 save.js: 保存失败仅 warning, 不让整个构建失败
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        cd /workdir/openwrt
        CACHE_TAG="${CACHE_TAG:-${CACHE_PREFIX}-$(git log --pretty=tformat:"%h" -n1 tools toolchain)}"
        echo "Saving cache to release: ${CACHE_TAG}"

        # --- 对齐 save.js: clean 时跳过保存; skip_saving 时跳过保存 ---
        if [ "${{ github.event.inputs.clean_cache }}" = "true" ]; then
          echo "clean=true: skip saving"
          exit 0
        fi
        if [ "${{ github.event.inputs.skip_saving }}" = "true" ]; then
          echo "skip_saving=true: skip saving"
          exit 0
        fi

        rm -rf /tmp/cacheout && mkdir -p /tmp/cacheout

        # --- 诊断: ccache 缓存真实体积 (判断是否触发 LRU 淘汰抖动) ---
        echo "ccache dir size: $(du -sh /workdir/openwrt/.ccache 2>/dev/null || echo '(not found)')"

        # --- 打包工具链 (与 utils.js 的 paths 一致: host* + tool*) ---
        if compgen -G "staging_dir/host*" > /dev/null || compgen -G "staging_dir/tool*" > /dev/null; then
          ( cd staging_dir && ls -d host* tool* 2>/dev/null ) > /tmp/tc_list
          tar czf /tmp/cacheout/toolchain.tar.gz -C staging_dir $(cat /tmp/tc_list)
          echo "toolchain archive: $(du -h /tmp/cacheout/toolchain.tar.gz | cut -f1)"
        fi

        # --- 打包 ccache (OpenWrt CONFIG_CCACHE 实际使用 openwrt/.ccache) ---
        if [ -d .ccache ]; then
          tar czf /tmp/cacheout/ccache_topdir.tar.gz -C . .ccache
          echo "ccache_topdir archive: $(du -h /tmp/cacheout/ccache_topdir.tar.gz | cut -f1)"
        fi

        # --- 分卷 (Release 单资产上限 2GiB, 留出余量) ---
        cd /tmp/cacheout
        for f in toolchain.tar.gz ccache_topdir.tar.gz; do
          if [ -f "$f" ]; then
            split -b 1900M -d "$f" "${f}-"
            rm -f "$f"   # 删除原始档案, 避免 Release 体积翻倍
          fi
        done
        ls -lh /tmp/cacheout

        if [ "${{ steps.restore.outputs.hit }}" = "1" ]; then
          # 精确命中: 工具链 key 未变, 只需滚动更新 ccache 资产
          # 先传新资产、成功后再删旧资产, 中途失败不会弄丢现有缓存
          OLD_CCACHE_NAMES=$(gh release view "$CACHE_TAG" -R "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[].name' | grep '^ccache_' | tr '\n' ' ')
          if ls ccache_*.tar.gz-* >/dev/null 2>&1; then
            gh release upload "$CACHE_TAG" -R "$GITHUB_REPOSITORY" ccache_*.tar.gz-*
          fi
          for a in $OLD_CCACHE_NAMES; do
            gh release delete-asset "$CACHE_TAG" "$a" -R "$GITHUB_REPOSITORY" -y
          done
          echo "ccache cache updated (toolchain unchanged)"
        else
          # 未命中: 删除旧 Release 后整体重建 (工具链 + ccache)
          gh release delete "$CACHE_TAG" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          NOTES="build cache: mixkey=w6-mtkw6 toolchain=${CACHE_TAG#*-} date=$(date -u +%FT%TZ)"
          if ls toolchain.tar.gz-* ccache_*.tar.gz-* >/dev/null 2>&1; then
            gh release create "$CACHE_TAG" -R "$GITHUB_REPOSITORY" \
              --title "OpenWrt build cache (w6-mtkw6)" \
              --notes "$NOTES" \
              toolchain.tar.gz-* ccache_*.tar.gz-* 2>/dev/null \
            || gh release create "$CACHE_TAG" -R "$GITHUB_REPOSITORY" \
              --title "OpenWrt build cache (w6-mtkw6)" \
              --notes "$NOTES" \
              toolchain.tar.gz-* 2>/dev/null \
            || gh release create "$CACHE_TAG" -R "$GITHUB_REPOSITORY" \
              --title "OpenWrt build cache (w6-mtkw6)" \
              --notes "$NOTES" \
              ccache_*.tar.gz-*
          fi
          echo "full cache saved"
        fi

        # ==========================================================
        # 清理其他 toolchainHash 的旧缓存 Release, 只保留当前这个
        # ==========================================================
        echo "===== 清理旧缓存 Release ====="
        gh release list -R "$GITHUB_REPOSITORY" --json tagName -q '.[].tagName' \
          | grep "^${CACHE_PREFIX}-" | grep -v "^${CACHE_TAG}$" \
          | while read -r old_tag; do
              echo "deleting stale cache release: $old_tag"
              gh release delete "$old_tag" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
            done
        echo "===== 清理完毕 ====="

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}


    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
        [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT


    - name: Delete workflow runs
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    # 只清理日期格式的正式发布 Tag (2026.10.11-xxxx),
    # 缓存 Tag (w6-mtkw6-cache-openwrt-<hash>) 不匹配该模式, 不会被误删
    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.3.0
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
        delete_tag_pattern: '^\d{4}\.\d{2}\.\d{2}-'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
