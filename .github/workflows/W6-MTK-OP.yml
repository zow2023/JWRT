name: W6-MTK-OP

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

# 避免相同工作流并发运行时争抢同一份构建缓存。
concurrency:
  group: w6-mtk-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/zow2023/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  FEEDS_CONF: W6/feeds.conf.default
  CONFIG_FILE: W6/mtkw6.config
  DIY_P1_SH: W6/diy-part1.sh
  DIY_P2_SH: W6/diy-part4.sh
  UPLOAD_BIN_DIR: 'false'
  UPLOAD_FIRMWARE: 'true'
  UPLOAD_COWTRANSFER: 'false'
  UPLOAD_WETRANSFER: 'false'
  UPLOAD_RELEASE: 'false'
  CCACHE_DIR: /workdir/openwrt/.ccache
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Optimize Environment & Free Space
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          echo 'Removing unused large SDKs...'
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL

          echo 'Installing build dependencies...'
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends \
            build-essential clang llvm flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev libelf-dev \
            dos2unix dwarves quilt npm jq ccache ninja-build \
            python3 python3-pip python3-setuptools \
            rsync swig unzip zlib1g-dev file wget xsltproc zip zstd

          sudo npm install -g pnpm
          sudo apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

          # Runner 每次使用全新虚拟机，只需设置 /workdir 本身的权限。
          sudo mkdir -p /workdir
          sudo chown "$USER":"$(id -gn)" /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          set -euo pipefail
          df -hT "$PWD"

          # 保留 Git 历史；cachewrtbuild 通过 git log tools/toolchain 计算缓存键。
          git clone --single-branch -b "$REPO_BRANCH" "$REPO_URL" openwrt
          ln -sfn /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          mkdir -p /workdir/openwrt/dl /workdir/openwrt/.ccache

      # 复用上游工具链目录与 ccache；该 Action 自己会用带时间戳的缓存键保存 ccache。
      - name: Cache OpenWrt Build
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: true
          toolchain: true
          skip: true
          prefix: /workdir/openwrt
          mixkey: w6-mtkw6

      - name: Load custom feeds
        run: |
          set -euo pipefail
          if [[ -e "$FEEDS_CONF" ]]; then
            mv "$FEEDS_CONF" openwrt/feeds.conf.default
          fi
          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: Update feeds
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds update -a

      - name: Install feeds
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          set -euo pipefail
          if [[ -e files ]]; then
            mv files openwrt/files
          fi
          if [[ -e "$CONFIG_FILE" ]]; then
            mv "$CONFIG_FILE" openwrt/.config
          fi
          chmod +x "$DIY_P2_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@v1.0.0
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Configure firmware
        run: |
          set -euo pipefail
          cd openwrt
          make defconfig
          mkdir -p dl

      # dl 是源码下载缓存，不与工具链/ccache 混在一起。
      # 每次使用新主键，避免命中不可变的旧缓存后无法保存新下载文件；restore-keys 复用最近的快照。
      - name: Cache OpenWrt download sources
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: dl-${{ runner.os }}-w6-mtk-${{ env.REPO_BRANCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dl-${{ runner.os }}-w6-mtk-${{ env.REPO_BRANCH }}-
            dl-${{ runner.os }}-w6-mtk-

      - name: Download packages
        id: package
        run: |
          set -euo pipefail
          cd openwrt
          make download -j"$(nproc)"
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        timeout-minutes: 360
        run: |
          set -euo pipefail
          cd openwrt

          echo '===== Configure ccache ====='
          mkdir -p .ccache
          ccache -M 5G
          ccache -z

          echo "===== Compile using $(nproc) threads ====="
          make -j"$(nproc)" || make -j1 || make -j1 V=s

          echo 'status=success' >> "$GITHUB_OUTPUT"

          grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
            | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          if [[ -s DEVICE_NAME ]]; then
            echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
          fi
          echo "FILE_DATE=_$(date +'%Y%m%d%H%M')" >> "$GITHUB_ENV"

          echo '===== ccache statistics ====='
          ccache -s

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          set -euo pipefail
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo 'status=success' >> "$GITHUB_OUTPUT"

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Upload firmware to cowtransfer
        id: cowtransfer
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
        run: |
          set -euo pipefail
          curl -fsSL git.io/file-transfer | sh
          ./transfer cow --block 2621440 -s -p 64 --no-progress "$FIRMWARE" 2>&1 | tee cowtransfer.log
          URL="$(grep -Eo 'https?://[^[:space:]]+' cowtransfer.log | tail -n 1)"
          echo "::warning file=cowtransfer.com::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to WeTransfer
        id: wetransfer
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
        run: |
          set -euo pipefail
          curl -fsSL git.io/file-transfer | sh
          ./transfer wet -s -p 16 --no-progress "$FIRMWARE" 2>&1 | tee wetransfer.log
          URL="$(grep -Eo 'https?://[^[:space:]]+' wetransfer.log | tail -n 1)"
          echo "::warning file=wetransfer.com::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          set -euo pipefail
          echo "release_tag=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"
          touch release.txt
          if [[ "$UPLOAD_COWTRANSFER" == 'true' && -n '${{ steps.cowtransfer.outputs.url }}' ]]; then
            echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
          fi
          if [[ "$UPLOAD_WETRANSFER" == 'true' && -n '${{ steps.wetransfer.outputs.url }}' ]]; then
            echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
          fi
          echo 'status=success' >> "$GITHUB_OUTPUT"

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 3

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.0
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
