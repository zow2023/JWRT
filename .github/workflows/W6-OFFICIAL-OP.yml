name: W6-OFFICIAL-OP

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      branch:
        description: 'OpenWrt 25.12 Branch'
        required: true
        default: 'v25.12.5'

env:
  REPO_BRANCH: ${{ github.event.inputs.branch || github.event.client_payload.branch || 'v25.12.5' }}
  FEEDS_CONF: W6/feeds.conf.default
  CONFIG_FILE: W6/of25125.config
  DIY_P1_SH: W6/diy-part1.sh
  DIY_P2_SH: W6/diy-part3.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  DEVICE_NAME: ""
  FILE_DATE: ""

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space (Clean Environment)
        run: |
          docker system prune -a -f --volumes || true

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/az \
            /usr/local/share/boost

          sudo -E apt-get -y purge \
            azure-cli \
            'ghc*' \
            'zulu*' \
            firefox \
            'google*' \
            'dotnet*' \
            powershell \
            'openjdk*' \
            'mysql*' \
            'php*' || true

          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          df -h

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils build-essential bzip2 \
            clang device-tree-compiler dwarves flex gawk gcc-multilib gettext git \
            libglib2.0-dev libncurses5-dev libssl-dev libtool libz-dev \
            libc6-dev-i386 llvm msmtp npm p7zip p7zip-full patch python3-dev \
            python3-pyelftools qemu-utils subversion texinfo tzdata uglifyjs \
            unzip upx xmlto zlib1g-dev mergerfs

          sudo npm install -g pnpm
          sudo -E apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Clone source code
        run: |
          sudo -E rm -rf /mnt/work /mnt/work_dir /data_dir
          sudo -E mkdir -p /data_dir /mnt/work_dir /mnt/work
          sudo -E chmod 777 /mnt/work /mnt/work_dir /data_dir
          sudo -E mergerfs -o defaults,allow_other,use_ino,category.create=mfs /mnt/work_dir:/data_dir /mnt/work
          git clone --depth 1 --branch "$REPO_BRANCH" https://github.com/openwrt/openwrt/ /mnt/work/openwrt

      - name: Load custom feeds
        run: |
          [ -e "$GITHUB_WORKSPACE/$FEEDS_CONF" ] && mv "$GITHUB_WORKSPACE/$FEEDS_CONF" /mnt/work/openwrt/feeds.conf.default
          [ -e "$GITHUB_WORKSPACE/$DIY_P1_SH" ] && chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          cd /mnt/work/openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: Update feeds
        run: cd /mnt/work/openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd /mnt/work/openwrt && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e "$GITHUB_WORKSPACE/files" ] && mv "$GITHUB_WORKSPACE/files" /mnt/work/openwrt/files
          [ -e "$GITHUB_WORKSPACE/$CONFIG_FILE" ] && mv "$GITHUB_WORKSPACE/$CONFIG_FILE" /mnt/work/openwrt/.config
          [ -e "$GITHUB_WORKSPACE/$DIY_P2_SH" ] && chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
          cd /mnt/work/openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: Fix rust
        run: |
          cd /mnt/work/openwrt
          sed -i 's/--set=llvm.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/' feeds/packages/lang/rust/Makefile

      - name: Fix libnftnl autotools version mismatch
        run: |
          cd /mnt/work/openwrt
          grep -q "PKG_FIXUP" package/libs/libnftnl/Makefile || \
            sed -i '/^PKG_INSTALL/i PKG_FIXUP:=autoreconf' package/libs/libnftnl/Makefile
          grep "PKG_FIXUP" package/libs/libnftnl/Makefile

      - name: Patch Kernel Config
        run: |
          cd /mnt/work/openwrt
          for cfg in $(find target/linux/mediatek -name "config-6*"); do
            echo "Checking $cfg"

            sed -i '/CONFIG_NET_SCH_BPF/d' "$cfg"
            echo "CONFIG_NET_SCH_BPF=y" >> "$cfg"

            sed -i '/CONFIG_BPF_SYSCALL/d' "$cfg"
            echo "CONFIG_BPF_SYSCALL=y" >> "$cfg"

            sed -i '/CONFIG_BPF_JIT/d' "$cfg"
            echo "CONFIG_BPF_JIT=y" >> "$cfg"

            sed -i '/CONFIG_NETKIT/d' "$cfg"
            echo "CONFIG_NETKIT=y" >> "$cfg"

            sed -i '/CONFIG_NF_CONNTRACK_CHAIN_EVENTS/d' "$cfg"
            echo "CONFIG_NF_CONNTRACK_CHAIN_EVENTS=y" >> "$cfg"
          done

      - name: Download package
        id: package
        run: |
          cd /mnt/work/openwrt
          make defconfig
          make download -j"$(nproc)"
          find dl -type f -size -1024c -exec ls -l {} \;
          find dl -type f -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          set -o pipefail
          cd /mnt/work/openwrt
          echo -e "$(nproc) thread compile"
          make -j"$(nproc)" 2>&1 | tee make.log || \
          make -j1 2>&1 | tee make.log || \
          make -j1 V=s 2>&1 | tee make.log

          echo "status=success" >> "$GITHUB_OUTPUT"
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

      - name: Upload make.log if failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-openwrt-log
          path: /mnt/work/openwrt/make.log

      - name: Organize files
        id: organize
        run: |
          cd /mnt/work/openwrt/bin/targets/*/*
          rm -rf packages
          FIRMWARE_PATH="$(pwd)"
          echo "FIRMWARE=${FIRMWARE_PATH}" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware directory
        if: steps.organize.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      # - name: Generate release tag
      #   id: tag
      #   run: |
      #     echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"
      #     touch release.txt
      #     echo "status=success" >> "$GITHUB_OUTPUT"

      # - name: Upload firmware to release
      #   uses: softprops/action-gh-release@v1
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     tag_name: ${{ steps.tag.outputs.release_tag }}
